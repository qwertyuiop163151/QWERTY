<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P 文件互传</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --primary: #4f6ef7;
            --primary-hover: #3b54d4;
            --text: #1a1a2e;
            --text-secondary: #5a5a7a;
            --border: #e2e6f0;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 8px 30px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.12), 0 4px 16px rgba(0, 0, 0, 0.06);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --drop-zone-bg: #fafbfd;
            --input-bg: #f9fafb;
            --btn-secondary-bg: #f4f5fa;
            --btn-secondary-hover-bg: #eaecf4;
            --room-display-bg: #f8f9fd;
            --lang-select-bg: #ffffff;
            --lang-select-text: #1a1a2e;
            --lang-select-border: #e2e6f0;
            --status-connecting-bg: #fffbeb;
            --status-connecting-text: #b45309;
            --status-connected-bg: #ecfdf5;
            --status-connected-text: #065f46;
            --status-transferring-bg: #eff6ff;
            --status-transferring-text: #1e40af;
            --status-complete-bg: #ecfdf5;
            --status-complete-text: #065f46;
            --status-error-bg: #fef2f2;
            --status-error-text: #991b1b;
            --drop-zone-hover-bg: #f5f6ff;
        }
        html[data-theme="dark"] {
            --bg: #111827;
            --card-bg: #1f2937;
            --primary: #818cf8;
            --primary-hover: #6366f1;
            --text: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #334155;
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 8px 30px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.5);
            --drop-zone-bg: #111827;
            --input-bg: #111827;
            --btn-secondary-bg: #374151;
            --btn-secondary-hover-bg: #4b5563;
            --room-display-bg: #111827;
            --lang-select-bg: #1f2937;
            --lang-select-text: #f1f5f9;
            --lang-select-border: #334155;
            --status-connecting-bg: #3a2f1b;
            --status-connecting-text: #fbbf24;
            --status-connected-bg: #1b3a2f;
            --status-connected-text: #34d399;
            --status-transferring-bg: #1b2a3a;
            --status-transferring-text: #60a5fa;
            --status-complete-bg: #1b3a2f;
            --status-complete-text: #34d399;
            --status-error-bg: #3a1b1b;
            --status-error-text: #f87171;
            --drop-zone-hover-bg: #26334a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text);
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.25s ease, color 0.25s ease;
        }
        .container {
            width: 100%;
            max-width: 580px;
        }
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 32px 28px;
            box-shadow: var(--shadow-md);
            transition: background-color 0.25s ease, border-color 0.25s ease;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #4f6ef7, #7c8cf8, #a78bfa, #4f6ef7);
            background-size: 200% 100%;
            animation: shimmer 3s ease-in-out infinite;
        }
        @keyframes shimmer {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .logo-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, #4f6ef7, #7c8cf8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(79, 110, 247, 0.3);
        }
        .logo-text {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.3px;
            transition: color 0.25s ease;
        }
        .controls {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .theme-toggle {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            line-height: 1;
            transition: background-color 0.25s ease;
            color: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            pointer-events: auto;
        }
        .theme-toggle:hover {
            background: var(--border);
        }
        .lang-select {
            background: var(--lang-select-bg);
            color: var(--lang-select-text);
            border: 1.5px solid var(--lang-select-border);
            border-radius: 8px;
            padding: 6px 8px;
            font-size: 0.9rem;
            cursor: pointer;
            outline: none;
            font-weight: 500;
            appearance: auto;
            transition: all var(--transition);
            max-width: 150px;
            pointer-events: auto;
        }
        .lang-select:hover {
            border-color: var(--primary);
        }
        .subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
            line-height: 1.5;
            transition: color 0.25s ease;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 24px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all var(--transition);
            letter-spacing: 0.2px;
            white-space: nowrap;
            user-select: none;
            -webkit-user-select: none;
            outline: none;
            position: relative;
            overflow: hidden;
            pointer-events: auto;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 14px rgba(79, 110, 247, 0.35);
        }
        .btn-primary:hover {
            background: var(--primary-hover);
            box-shadow: 0 6px 20px rgba(79, 110, 247, 0.45);
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: var(--btn-secondary-bg);
            color: var(--text);
            border: 1.5px solid var(--border);
        }
        .btn-secondary:hover {
            background: var(--btn-secondary-hover-bg);
            border-color: #c8cde0;
        }
        .btn-success {
            background: var(--success);
            color: #fff;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
        }
        .btn-success:hover {
            background: #059669;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }
        .btn-sm {
            padding: 8px 16px;
            font-size: 0.85rem;
            border-radius: 30px;
        }
        .btn-block {
            width: 100%;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }
        .btn-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn-row .btn {
            flex: 1;
            min-width: 120px;
        }
        .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 20px 0;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
            transition: color 0.25s ease;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
            transition: background-color 0.25s ease;
        }
        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .input-group input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 50px;
            border: 1.5px solid var(--border);
            font-size: 1rem;
            outline: none;
            transition: all var(--transition);
            background: var(--input-bg);
            letter-spacing: 1px;
            font-weight: 600;
            text-align: center;
            text-transform: uppercase;
            color: var(--text);
            pointer-events: auto;
        }
        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 110, 247, 0.1);
            background: var(--card-bg);
        }
        .input-group input::placeholder {
            letter-spacing: 0;
            font-weight: 400;
            text-transform: none;
            color: #b0b8c8;
        }
        .room-display {
            background: var(--room-display-bg);
            border-radius: var(--radius-sm);
            padding: 20px;
            text-align: center;
            border: 1.5px dashed var(--border);
            margin: 16px 0;
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }
        .room-code {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 4px;
            color: var(--primary);
            font-family: 'SF Mono', 'Fira Code', 'Consolas', 'Monaco', monospace;
            user-select: all;
            -webkit-user-select: all;
            word-break: break-all;
            transition: color 0.25s ease;
        }
        .room-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 600;
            transition: color 0.25s ease;
        }
        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: var(--radius-sm);
            padding: 36px 20px;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition);
            background: var(--drop-zone-bg);
            margin: 16px 0;
            position: relative;
            pointer-events: auto;
        }
        .drop-zone:hover,
        .drop-zone.drag-over {
            border-color: var(--primary);
            background: var(--drop-zone-hover-bg);
            box-shadow: 0 0 0 4px rgba(79, 110, 247, 0.06);
        }
        .drop-zone-icon {
            font-size: 42px;
            margin-bottom: 8px;
            display: block;
        }
        .drop-zone-text {
            font-weight: 600;
            color: var(--text);
            font-size: 0.95rem;
            transition: color 0.25s ease;
        }
        .drop-zone-hint {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 4px;
            transition: color 0.25s ease;
        }
        .drop-zone input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            pointer-events: auto;
        }
        .file-list {
            list-style: none;
            margin: 12px 0;
        }
        .file-list li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: var(--input-bg);
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 0.9rem;
            border: 1px solid var(--border);
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }
        .file-list .file-icon {
            font-size: 1.4rem;
            flex-shrink: 0;
        }
        .file-list .file-info {
            flex: 1;
            min-width: 0;
        }
        .file-list .file-name {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text);
        }
        .file-list .file-size {
            font-size: 0.78rem;
            color: var(--text-secondary);
        }
        .file-list .file-remove {
            cursor: pointer;
            color: #999;
            font-size: 1.2rem;
            padding: 4px 8px;
            border-radius: 50%;
            transition: all var(--transition);
            background: none;
            border: none;
            line-height: 1;
            pointer-events: auto;
        }
        .file-list .file-remove:hover {
            color: var(--danger);
            background: #fef2f2;
        }
        .progress-wrapper {
            margin: 16px 0;
        }
        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text);
        }
        .progress-bar-outer {
            height: 10px;
            background: #eef0f6;
            border-radius: 10px;
            overflow: hidden;
            transition: background-color 0.25s ease;
        }
        .progress-bar-inner {
            height: 100%;
            background: linear-gradient(90deg, #4f6ef7, #7c8cf8);
            border-radius: 10px;
            transition: width 0.3s ease;
            width: 0%;
        }
        .progress-bar-inner.complete {
            background: linear-gradient(90deg, #10b981, #34d399);
        }
        .speed-text {
            font-size: 0.78rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            transition: background-color 0.25s ease, color 0.25s ease;
        }
        .status-connecting {
            background: var(--status-connecting-bg);
            color: var(--status-connecting-text);
        }
        .status-connected {
            background: var(--status-connected-bg);
            color: var(--status-connected-text);
        }
        .status-transferring {
            background: var(--status-transferring-bg);
            color: var(--status-transferring-text);
        }
        .status-complete {
            background: var(--status-complete-bg);
            color: var(--status-complete-text);
        }
        .status-error {
            background: var(--status-error-bg);
            color: var(--status-error-text);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            animation: pulse-dot 1.5s ease-in-out infinite;
        }
        .status-dot.connecting {
            background: #f59e0b;
        }
        .status-dot.connected {
            background: #10b981;
            animation: none;
        }
        .status-dot.transferring {
            background: #3b82f6;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.7);
            }
        }
        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin: 12px 0;
            font-weight: 500;
            line-height: 1.5;
            transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        }
        .alert-info {
            background: #eff6ff;
            color: #1e40af;
            border: 1px solid #bfdbfe;
        }
        .alert-warning {
            background: #fffbeb;
            color: #92400e;
            border: 1px solid #fde68a;
        }
        .alert-error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        .alert-success {
            background: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
        .hidden {
            display: none !important;
        }
        .fade-in {
            animation: fadeIn 0.35s ease-out;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .text-center {
            text-align: center;
        }
        .mt-2 {
            margin-top: 8px;
        }
        .mt-3 {
            margin-top: 16px;
        }
        .mb-2 {
            margin-bottom: 8px;
        }
        .mb-3 {
            margin-bottom: 16px;
        }
        .gap-2 {
            gap: 8px;
        }
        .copy-tooltip {
            position: relative;
        }
        .copy-tooltip::after {
            content: '已复制!';
            position: absolute;
            top: -36px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a2e;
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .copy-tooltip.copied::after {
            opacity: 1;
        }
        html[dir="rtl"] .controls {
            margin-left: 0;
            margin-right: auto;
        }
        html[dir="rtl"] .logo {
            flex-direction: row-reverse;
        }
        html[dir="rtl"] .btn-row,
        html[dir="rtl"] .input-group {
            flex-direction: row-reverse;
        }
        html[dir="rtl"] .file-list li {
            flex-direction: row-reverse;
        }
        html[dir="rtl"] .file-list .file-info {
            text-align: right;
        }
        @media (max-width: 480px) {
            .card {
                padding: 24px 16px;
                border-radius: 14px;
            }
            .room-code {
                font-size: 1.6rem;
                letter-spacing: 3px;
            }
            .btn {
                padding: 12px 18px;
                font-size: 0.9rem;
            }
            .btn-row {
                flex-direction: column;
            }
            .btn-row .btn {
                min-width: auto;
            }
            .input-group {
                flex-direction: column;
                gap: 8px;
            }
            .drop-zone {
                padding: 24px 14px;
            }
            .controls {
                gap: 4px;
            }
            .lang-select {
                max-width: 120px;
                font-size: 0.8rem;
            }
        }
        html[data-theme="dark"] .alert-info {
            background: #1b2a3a;
            color: #60a5fa;
            border-color: #1e3a5f;
        }
        html[data-theme="dark"] .alert-warning {
            background: #3a2f1b;
            color: #fbbf24;
            border-color: #5f3f1e;
        }
        html[data-theme="dark"] .alert-error {
            background: #3a1b1b;
            color: #f87171;
            border-color: #5f1e1e;
        }
        html[data-theme="dark"] .alert-success {
            background: #1b3a2f;
            color: #34d399;
            border-color: #1e5f3f;
        }
        html[data-theme="dark"] .progress-bar-outer {
            background: #374151;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card" id="mainCard">
            <div class="logo">
                <div class="logo-icon">📁</div>
                <div class="logo-text" data-i18n="app_title">P2P 文件互传</div>
                <div class="controls">
                    <select id="langSelect" class="lang-select" title="Language / 语言">
                        <option value="zh">中文</option>
                        <option value="en">English</option>
                        <option value="ja">日本語</option>
                        <option value="ko">한국어</option>
                        <option value="ru">Русский</option>
                        <option value="de">Deutsch</option>
                        <option value="fr">Français</option>
                        <option value="es">Español</option>
                        <option value="ar">العربية</option>
                        <option value="pt">Português</option>
                        <option value="it">Italiano</option>
                        <option value="nl">Nederlands</option>
                        <option value="pl">Polski</option>
                        <option value="tr">Türkçe</option>
                        <option value="vi">Tiếng Việt</option>
                        <option value="th">ไทย</option>
                        <option value="id">Bahasa Indonesia</option>
                        <option value="hi">हिन्दी</option>
                    </select>
                    <button class="theme-toggle" id="themeToggle" title="切换深色/浅色模式" aria-label="切换主题">🌙</button>
                </div>
            </div>
            <p class="subtitle" data-i18n="app_subtitle">安全、快速的端到端文件传输<br>同一房间内的两个人可以互相发送文件</p>

            <div id="screenIdle">
                <div class="btn-row">
                    <button class="btn btn-primary" id="btnCreate" data-i18n="create_room">✨ 创建房间</button>
                    <button class="btn btn-secondary" id="btnJoin" data-i18n="join_room">🔗 加入房间</button>
                </div>
            </div>

            <div id="screenJoin" class="hidden fade-in">
                <div class="input-group mb-3">
                    <input type="text" id="roomCodeInput" placeholder="输入房间号" maxlength="8" autocomplete="off"
                    autocorrect="off" autocapitalize="characters" spellcheck="false" data-i18n-placeholder="placeholder_room_code">
                    <button class="btn btn-primary" id="btnJoinConfirm" data-i18n="join">加入</button>
                </div>
                <button class="btn btn-secondary btn-sm btn-block" id="btnBack" data-i18n="back">← 返回</button>
                <div id="joinStatus" class="hidden"></div>
            </div>

            <div id="screenRoom" class="hidden fade-in">
                <div class="room-display">
                    <div class="room-label" id="roomInfoLabel" data-i18n="room_number">房间号</div>
                    <div class="room-code" id="roomCodeDisplay">------</div>
                    <div class="mt-2" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
                        <button class="btn btn-secondary btn-sm copy-tooltip" id="btnCopyRoom" data-i18n="copy_room">📋 复制房间号</button>

        // ============ 全局变量 ============

        let selectedFiles = [];

        let totalBytesToSend = 0;
        let totalBytesReceived = 0;
        let totalBytesToReceive = 0;
        let lastSpeedUpdate = 0;
        let bytesSinceLastUpdate = 0;
        let receivedFileChunks = {};
        let receivedFileCount = 0;
        let expectedFileCount = 0;
        let transferComplete = false;
        let isCreator = false;
        let currentSendStatus = null;
        let currentReceiveStatus = null;

        // ============ DOM 引用 ============
        const $ = (sel) => document.querySelector(sel);
        const themeToggleBtn = $('#themeToggle');
        const langSelect = $('#langSelect');
        const screenIdle = $('#screenIdle');
        const screenJoin = $('#screenJoin');
        const screenRoom = $('#screenRoom');
        const roomCodeDisplay = $('#roomCodeDisplay');
        const roomInfoLabel = $('#roomInfoLabel');
        const roomCodeInput = $('#roomCodeInput');
        const fileInput = $('#fileInput');
        const fileList = $('#fileList');
        const dropZone = $('#dropZone');
        const sendStatus = $('#sendStatus');
        const sendProgress = $('#sendProgress');
        const sendProgressBar = $('#sendProgressBar');
        const sendProgressLabel = $('#sendProgressLabel');
        const sendSpeed = $('#sendSpeed');
        const receiveStatus = $('#receiveStatus');
        const receiveProgress = $('#receiveProgress');
        const receiveProgressBar = $('#receiveProgressBar');
        const receiveProgressLabel = $('#receiveProgressLabel');
        const receiveSpeed = $('#receiveSpeed');
        const receiveFileInfo = $('#receiveFileInfo');
        const receivedFiles = $('#receivedFiles');
        const receivedFileList = $('#receivedFileList');
        const globalAlert = $('#globalAlert');
        const joinStatus = $('#joinStatus');
        const btnCopyRoom = $('#btnCopyRoom');
        const htmlElement = document.documentElement;

        // ============ 工具函数 ============
        function t(key, vars) {
            let text = translations[currentLang]?.[key] || translations.zh[key] || key;
            if (vars) {
                Object.keys(vars).forEach(varKey => {
                    text = text.replace(`{${varKey}}`, vars[varKey]);
                });
            }
            return text;
        }

        function applyTheme(theme) {
            htmlElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            themeToggleBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
        }
        applyTheme(localStorage.getItem('theme') || 'light');
        themeToggleBtn.addEventListener('click', () => {
            const newTheme = htmlElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            applyTheme(newTheme);
        });

        function applyLanguage() {
            if (currentLang === 'ar') {
                htmlElement.setAttribute('dir', 'rtl');
            } else {
                htmlElement.setAttribute('dir', 'ltr');
            }
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (key === 'app_subtitle') {
                    el.innerHTML = t(key);
                } else {
                    el.textContent = t(key);
                }
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                el.setAttribute('placeholder', t(key));
            });
            document.querySelectorAll('#fileList .file-remove').forEach(btn => {
                btn.title = t('remove_file');
            });
            document.querySelectorAll('#receivedFileList .btn-success').forEach(btn => {
                btn.textContent = t('download');
            });
            if (currentSendStatus) {
                updateSendStatus(currentSendStatus.status, currentSendStatus.key, currentSendStatus.vars);
            }
            if (currentReceiveStatus) {
                updateReceiveStatus(currentReceiveStatus.status, currentReceiveStatus.key, currentReceiveStatus.vars);
            }
            if (roomInfoLabel) {
                if (appState === 'room' && isCreator) {
                    roomInfoLabel.textContent = t('room_number');
                } else if (appState === 'room' && !isCreator) {
                    roomInfoLabel.textContent = t('connected_to_room');
                }
            }
        }
        langSelect.value = currentLang;
        langSelect.addEventListener('change', function() {
            currentLang = this.value;
            localStorage.setItem('lang', currentLang);
            applyLanguage();
        });

        const PEER_SERVER = { host: '0.peerjs.com', port: 443, secure: true };
        const CHUNK_SIZE = 65536;
        const ROOM_ID_LENGTH = 6;
        const ROOM_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';

        function generateRoomId() {
            let result = '';
            for (let i = 0; i < ROOM_ID_LENGTH; i++) {
                result += ROOM_CHARS[Math.floor(Math.random() * ROOM_CHARS.length)];
            }
            return result;
        }

        function formatSize(bytes) {
            if (bytes === 0) return '0 B';
            const units = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(1024));
            return (bytes / Math.pow(1024, i)).toFixed(i >= 2 ? 2 : 1) + ' ' + units[i];
        }

        function formatSpeed(bytesPerSec) {
            if (bytesPerSec < 1024) return bytesPerSec.toFixed(0) + ' B/s';
            if (bytesPerSec < 1024 * 1024) return (bytesPerSec / 1024).toFixed(1) + ' KB/s';
            return (bytesPerSec / (1024 * 1024)).toFixed(2) + ' MB/s';
        }

        function showAlert(message, type = 'info') {
            globalAlert.className = 'alert alert-' + type + ' fade-in';
            globalAlert.textContent = message;
            globalAlert.classList.remove('hidden');
            clearTimeout(globalAlert._timeout);
            globalAlert._timeout = setTimeout(() => globalAlert.classList.add('hidden'), 4000);
        }

        function hideAllScreens() {
            [screenIdle, screenJoin, screenRoom].forEach(s => s.classList.add('hidden'));
        }

        function showScreen(screen) {
            hideAllScreens();
            screen.classList.remove('hidden');
            screen.classList.add('fade-in');
        }

        function cleanupPeer() {
            if (conn) { try { conn.close(); } catch (e) {} conn = null; }
            if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
        }

        function resetAll() {
            cleanupPeer();
            appState = 'idle';
            roomId = '';
            selectedFiles = [];
            isCreator = false;
            totalBytesSent = 0;
            totalBytesToSend = 0;
            totalBytesReceived = 0;
            totalBytesToReceive = 0;
            lastSpeedUpdate = 0;
            bytesSinceLastUpdate = 0;
            receivedFileChunks = {};
            receivedFileCount = 0;
            expectedFileCount = 0;
            transferComplete = false;
            fileInput.value = '';
            fileList.innerHTML = '';
            fileList.classList.add('hidden');
            sendProgress.classList.add('hidden');
            sendProgressBar.style.width = '0%';
            sendProgressBar.classList.remove('complete');
            sendSpeed.textContent = '';
            receiveProgress.classList.add('hidden');
            receiveProgressBar.style.width = '0%';
            receiveProgressBar.classList.remove('complete');
            receiveSpeed.textContent = '';
            receiveFileInfo.classList.add('hidden');
            receivedFiles.classList.add('hidden');
            receivedFileList.innerHTML = '';
            joinStatus.classList.add('hidden');
            globalAlert.classList.add('hidden');
            roomCodeInput.value = '';
            btnCopyRoom.classList.remove('copied');
            currentSendStatus = null;
            currentReceiveStatus = null;
            showScreen(screenIdle);
            applyLanguage();
        }

        // ============ 房间管理 ============
        function createRoom() {
            resetAll();
            roomId = generateRoomId();
            isCreator = true;
            appState = 'room';
            showScreen(screenRoom);
            roomInfoLabel.textContent = t('room_number');
            roomCodeDisplay.textContent = roomId;
            initPeer(roomId);
            updateSendStatus('connecting', 'waiting_for_peer');
            updateReceiveStatus('connecting', 'waiting_for_files');
        }

        function initPeer(peerId) {
            cleanupPeer();
            peer = new Peer(peerId, {
                host: PEER_SERVER.host,
                port: PEER_SERVER.port,
                secure: PEER_SERVER.secure,
                debug: 0,
            });
            peer.on('open', (id) => {
                if (isCreator) {
                    updateSendStatus('connecting', 'waiting_for_peer');
                }
            });
            peer.on('connection', (incomingConn) => {
                if (isCreator && appState === 'room') {
                    conn = incomingConn;
                    setupConnection();
                    updateSendStatus('connected', 'peer_connected');
                }
            });
            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    roomId = generateRoomId();
                    roomCodeDisplay.textContent = roomId;
                    initPeer(roomId);
                    showAlert(t('room_conflict'), 'warning');
                } else if (err.type === 'peer-unavailable') {
                    showAlert(t('room_not_found'), 'error');
                    updateSendStatus('error', 'room_not_found');
                } else if (err.type === 'network' || err.type === 'server-error') {
                    showAlert(t('network_error'), 'error');
                }
            });
            peer.on('disconnected', () => {
                if (!transferComplete && peer && !peer.destroyed) peer.reconnect();
            });
        }

        function showJoinScreen() {
            resetAll();
            appState = 'joining';
            showScreen(screenJoin);
            roomCodeInput.value = '';
            roomCodeInput.focus();
            joinStatus.classList.add('hidden');
            applyLanguage();
        }

        function goBackToIdle() {
            resetAll();
        }

        function joinRoom() {
            const inputCode = roomCodeInput.value.trim().toUpperCase();
            if (!inputCode || inputCode.length < 3) {
                showAlert(t('room_not_found'), 'warning');
                return;
            }
            roomId = inputCode;
            isCreator = false;
            appState = 'room';
            showScreen(screenRoom);
            roomInfoLabel.textContent = t('connected_to_room');
            roomCodeDisplay.textContent = roomId;
            updateSendStatus('connecting', 'connecting_room');
            updateReceiveStatus('connecting', 'waiting_for_files');
            cleanupPeer();
            peer = new Peer({
                host: PEER_SERVER.host,
                port: PEER_SERVER.port,
                secure: PEER_SERVER.secure,
                debug: 0,
            });
            peer.on('open', () => {
                conn = peer.connect(roomId, { reliable: true, serialization: 'binary' });
                setupConnection();
            });
            peer.on('error', (err) => {
                if (err.type === 'peer-unavailable') {
                    showAlert(t('room_not_found'), 'error');
                    updateSendStatus('error', 'join_status_error');
                } else if (err.type === 'network' || err.type === 'server-error') {
                    showAlert(t('network_error'), 'error');
                }
            });
            peer.on('disconnected', () => {
                if (!transferComplete && peer && !peer.destroyed) peer.reconnect();
            });
        }

        function setupConnection() {
            if (!conn) return;
            conn.on('open', () => {
                appState = 'room';
                updateSendStatus('connected', 'connected_can_send');
                updateReceiveStatus('connected', 'waiting_for_files');
                if (selectedFiles.length > 0) {
                    startSendingFiles();
                }
            });
            conn.on('data', (data) => handleIncomingData(data));
            conn.on('close', () => {
                if (!transferComplete) {
                    showAlert(t('connection_closed'), 'warning');
                    updateSendStatus('error', 'connection_closed');
                }
            });
            conn.on('error', () => showAlert(t('data_error'), 'error'));
        }

        // ============ 文件传输 ============
        function handleIncomingData(data) {
            if (!(data instanceof ArrayBuffer)) {
                if (data instanceof Uint8Array) data = data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength);
                else if (typeof data === 'object' && data !== null) {
                    try { data = new TextEncoder().encode(JSON.stringify(data)).buffer; } catch (e) { return; }
                } else return;
            }
            const view = new DataView(data);
            if (data.byteLength < 1) return;
            const msgType = view.getUint8(0);
            if (msgType === 0) {
                const jsonStr = new TextDecoder().decode(new Uint8Array(data, 1));
                try { handleMetadata(JSON.parse(jsonStr)); } catch (e) {}
            } else if (msgType === 1) {
                if (data.byteLength < 13) return;
                handleFileChunk(view.getUint32(1, false), view.getUint32(5, false), view.getUint32(9, false), new Uint8Array(data, 13));
            } else if (msgType === 2) {
                const jsonStr = new TextDecoder().decode(new Uint8Array(data, 1));
                try { handleTransferComplete(JSON.parse(jsonStr)); } catch (e) {}
            }
        }

        function handleMetadata(meta) {
            expectedFileCount = meta.files ? meta.files.length : 0;
            totalBytesToReceive = meta.totalSize || 0;
            receivedFileChunks = {};
            receivedFileCount = 0;
            totalBytesReceived = 0;
            lastSpeedUpdate = Date.now();
            bytesSinceLastUpdate = 0;
            transferComplete = false;
            if (meta.files) {
                meta.files.forEach((f, i) => {
                    receivedFileChunks[i] = {
                        chunks: new Array(f.totalChunks || 1),
                        totalChunks: f.totalChunks || 1,
                        name: f.name || 'unknown_file',
                        size: f.size || 0,
                        mime: f.type || 'application/octet-stream',
                        receivedChunks: 0,
                    };
                });
            }
            updateReceiveStatus('transferring', 'receiving_files_count', { count: expectedFileCount });
            receiveProgress.classList.remove('hidden');
            receiveFileInfo.classList.remove('hidden');
            receiveFileInfo.className = 'alert alert-info';
            const names = meta.files.map(f => f.name).join(', ');
            const sizeText = formatSize(meta.totalSize || 0);
            receiveFileInfo.textContent = t('receiving_file_info', { names: names, size: sizeText });
            receivedFiles.classList.add('hidden');
            updateReceiveProgress(0);
        }

        function handleFileChunk(fileIndex, chunkIndex, totalChunks, chunkData) {
            if (!receivedFileChunks[fileIndex]) {
                receivedFileChunks[fileIndex] = {
                    chunks: new Array(totalChunks),
                    totalChunks: totalChunks,
                    name: `file_${fileIndex}`,
                    size: 0,
                    mime: 'application/octet-stream',
                    receivedChunks: 0,
                };
            }
            const fileInfo = receivedFileChunks[fileIndex];
            if (fileInfo.totalChunks < totalChunks) {
                const newChunks = new Array(totalChunks);
                for (let i = 0; i < fileInfo.chunks.length; i++) newChunks[i] = fileInfo.chunks[i];
                fileInfo.chunks = newChunks;
                fileInfo.totalChunks = totalChunks;
            }
            if (!fileInfo.chunks[chunkIndex]) {
                fileInfo.chunks[chunkIndex] = chunkData;
                fileInfo.receivedChunks++;
                totalBytesReceived += chunkData.byteLength;
            }
            const now = Date.now();
            const elapsed = (now - lastSpeedUpdate) / 1000;
            bytesSinceLastUpdate += chunkData.byteLength;
            if (elapsed >= 1.0) {
                receiveSpeed.textContent = formatSpeed(bytesSinceLastUpdate / elapsed);
                bytesSinceLastUpdate = 0;
                lastSpeedUpdate = now;
            }
            if (totalBytesToReceive > 0) updateReceiveProgress(Math.min(100, Math.round((totalBytesReceived / totalBytesToReceive) * 100)));
            if (fileInfo.receivedChunks >= fileInfo.totalChunks) assembleAndDownloadFile(fileIndex);
        }

        function handleTransferComplete() {
            transferComplete = true;
            updateReceiveStatus('complete', 'transfer_complete');
            receiveProgressBar.style.width = '100%';
            receiveProgressBar.classList.add('complete');
            receiveSpeed.textContent = '';
            receiveFileInfo.className = 'alert alert-success';
            receiveFileInfo.textContent = t('transfer_complete_alert');
            receivedFiles.classList.remove('hidden');
            showAlert(t('transfer_complete_alert'), 'success');
        }

        function assembleAndDownloadFile(fileIndex) {
            const fileInfo = receivedFileChunks[fileIndex];
            if (!fileInfo || fileInfo._assembled) return;
            fileInfo._assembled = true;
            const totalLength = fileInfo.chunks.reduce((sum, chunk) => sum + (chunk ? chunk.byteLength : 0), 0);
            const assembled = new Uint8Array(totalLength);
            let offset = 0;
            for (let i = 0; i < fileInfo.totalChunks; i++) {
                if (fileInfo.chunks[i]) { assembled.set(fileInfo.chunks[i], offset); offset += fileInfo.chunks[i].byteLength; }
            }
            const blob = new Blob([assembled], { type: fileInfo.mime });
            const url = URL.createObjectURL(blob);
            const li = document.createElement('li');
            li.innerHTML = `<span class="file-icon">📄</span><div class="file-info"><div class="file-name">${escapeHtml(fileInfo.name)}</div><div class="file-size">${formatSize(fileInfo.size || totalLength)}</div></div><button class="btn btn-success btn-sm" onclick="downloadFile('${url.replace(/'/g, "\\'")}', '${escapeHtml(fileInfo.name).replace(/'/g, "\\'")}')">${t('download')}</button>`;
            receivedFileList.appendChild(li);
            receivedFiles.classList.remove('hidden');
            autoDownload(url, fileInfo.name);
            receivedFileCount++;
            if (expectedFileCount > 0 && receivedFileCount >= expectedFileCount) {
                transferComplete = true;
                updateReceiveStatus('complete', 'receive_complete');
                receiveProgressBar.style.width = '100%';
                receiveProgressBar.classList.add('complete');
                receiveSpeed.textContent = '';
                receiveFileInfo.className = 'alert alert-success';
                receiveFileInfo.textContent = t('all_received');
                showAlert(t('all_received'), 'success');
            }
        }

        function autoDownload(url, filename) {
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            setTimeout(() => document.body.removeChild(a), 100);
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        window.downloadFile = function(url, filename) {
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            setTimeout(() => document.body.removeChild(a), 100);
        };

        function startSendingFiles() {
            if (!conn || selectedFiles.length === 0 || transferComplete) return;
            totalBytesSent = 0;
            totalBytesToSend = selectedFiles.reduce((sum, f) => sum + f.size, 0);
            lastSpeedUpdate = Date.now();
            bytesSinceLastUpdate = 0;
            updateSendStatus('transferring', 'sending_files');
            sendProgress.classList.remove('hidden');
            sendProgressBar.style.width = '0%';
            sendProgressBar.classList.remove('complete');
            sendSpeed.textContent = '';
            const filesMeta = selectedFiles.map((f) => ({
                name: f.name,
                size: f.size,
                type: f.type || 'application/octet-stream',
                totalChunks: Math.ceil(f.size / CHUNK_SIZE),
            }));
            sendBinaryMessage(0, JSON.stringify({ type: 'meta', files: filesMeta, totalSize: totalBytesToSend, fileCount: selectedFiles.length }));
            setTimeout(() => sendAllFiles(0), 200);
        }

        function sendAllFiles(fileIndex) {
            if (fileIndex >= selectedFiles.length) {
                sendBinaryMessage(2, JSON.stringify({ type: 'complete', fileCount: selectedFiles.length }));
                transferComplete = true;
                updateSendStatus('complete', 'send_complete');
                sendProgressBar.style.width = '100%';
                sendProgressBar.classList.add('complete');
                sendSpeed.textContent = '';
                showAlert(t('all_sent'), 'success');
                return;
            }
            sendSingleFile(fileIndex, () => sendAllFiles(fileIndex + 1));
        }

        function sendSingleFile(fileIndex, onComplete) {
            const file = selectedFiles[fileIndex];
            const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
            let currentChunk = 0;
            const reader = new FileReader();
            function readNextChunk() {
                if (currentChunk >= totalChunks) { onComplete(); return; }
                const start = currentChunk * CHUNK_SIZE;
                const end = Math.min(start + CHUNK_SIZE, file.size);
                reader.readAsArrayBuffer(file.slice(start, end));
            }
            reader.onload = function(e) {
                const chunkData = new Uint8Array(e.target.result);
                sendFileChunk(fileIndex, currentChunk, totalChunks, chunkData);
                totalBytesSent += chunkData.byteLength;
                currentChunk++;
                const now = Date.now();
                const elapsed = (now - lastSpeedUpdate) / 1000;
                bytesSinceLastUpdate += chunkData.byteLength;
                if (elapsed >= 1.0) {
                    sendSpeed.textContent = formatSpeed(bytesSinceLastUpdate / elapsed);
                    bytesSinceLastUpdate = 0;
                    lastSpeedUpdate = now;
                }
                updateSendProgress(Math.round((totalBytesSent / totalBytesToSend) * 100));
                if (conn && conn._dc && conn._dc.bufferedAmount > 1024 * 1024) {
                    conn._dc.addEventListener('bufferedamountlow', function onLow() {
                        conn._dc.removeEventListener('bufferedamountlow', onLow);
                        readNextChunk();
                    });
                } else {
                    if (currentChunk % 20 === 0) setTimeout(readNextChunk, 5);
                    else readNextChunk();
                }
            };
            reader.onerror = () => { showAlert(t('read_error'), 'error'); onComplete(); };
            readNextChunk();
        }

        function sendBinaryMessage(msgType, jsonPayload) {
            if (!conn) return;
            const jsonBytes = new TextEncoder().encode(jsonPayload);
            const buffer = new ArrayBuffer(1 + jsonBytes.byteLength);
            new DataView(buffer).setUint8(0, msgType);
            new Uint8Array(buffer, 1).set(jsonBytes);
            conn.send(buffer);
        }

        function sendFileChunk(fileIndex, chunkIndex, totalChunks, chunkData) {
            if (!conn) return;
            const buffer = new ArrayBuffer(13 + chunkData.byteLength);
            const view = new DataView(buffer);
            view.setUint8(0, 1);
            view.setUint32(1, fileIndex, false);
            view.setUint32(5, chunkIndex, false);
            view.setUint32(9, totalChunks, false);
            new Uint8Array(buffer, 13).set(chunkData);
            conn.send(buffer);
        }

        function updateSendStatus(status, key, vars) {
            currentSendStatus = { status, key, vars };
            const map = {
                connecting: ['connecting', 'status-connecting'],
                connected: ['connected', 'status-connected'],
                transferring: ['transferring', 'status-transferring'],
                complete: ['connected', 'status-complete'],
                error: ['', 'status-error']
            };
            const [dot, badge] = map[status] || ['connecting', 'status-connecting'];
            const text = t(key, vars);
            sendStatus.innerHTML = `<span class="status-badge ${badge}">${dot ? `<span class="status-dot ${dot}"></span>` : ''} ${text}</span>`;
        }

        function updateReceiveStatus(status, key, vars) {
            currentReceiveStatus = { status, key, vars };
            const map = {
                connecting: ['connecting', 'status-connecting'],
                connected: ['connected', 'status-connected'],
                transferring: ['transferring', 'status-transferring'],
                complete: ['connected', 'status-complete'],
                error: ['', 'status-error']
            };
            const [dot, badge] = map[status] || ['connecting', 'status-connecting'];
            const text = t(key, vars);
            receiveStatus.innerHTML = `<span class="status-badge ${badge}">${dot ? `<span class="status-dot ${dot}"></span>` : ''} ${text}</span>`;
        }

        function updateSendProgress(percent) {
            sendProgressBar.style.width = percent + '%';
            sendProgressLabel.textContent = t('sending_progress', { percent: percent });
        }

        function updateReceiveProgress(percent) {
            receiveProgressBar.style.width = percent + '%';
            receiveProgressLabel.textContent = t('sending_progress', { percent: percent });
        }

        function copyRoomCode() {
            if (!roomId) return;
            navigator.clipboard.writeText(roomId).then(() => {
                btnCopyRoom.classList.add('copied');
                setTimeout(() => btnCopyRoom.classList.remove('copied'), 1800);
            }).catch(() => {
                const input = document.createElement('input');
                input.value = roomId;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                btnCopyRoom.classList.add('copied');
                setTimeout(() => btnCopyRoom.classList.remove('copied'), 1800);
            });
        }

        function shareRoomLink() {
            const link = `${window.location.origin}${window.location.pathname}?room=${roomId}`;
            navigator.clipboard.writeText(link).then(() => showAlert(t('copy_success'), 'success')).catch(() => {
                const input = document.createElement('input');
                input.value = link;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                showAlert(t('link_copied'), 'success');
            });
        }

        // ============ 事件绑定 ============
        document.getElementById('btnCreate').addEventListener('click', createRoom);
        document.getElementById('btnJoin').addEventListener('click', showJoinScreen);
        document.getElementById('btnBack').addEventListener('click', goBackToIdle);
        document.getElementById('btnJoinConfirm').addEventListener('click', joinRoom);
        document.getElementById('btnRestart').addEventListener('click', resetAll);
        document.getElementById('btnCopyRoom').addEventListener('click', copyRoomCode);
        document.getElementById('btnShareLink').addEventListener('click', shareRoomLink);

        fileInput.addEventListener('change', function() {
            handleFileSelection(Array.from(this.files));
        });
        dropZone.addEventListener('dragover', function(e) { e.preventDefault(); this.classList.add('drag-over'); });
        dropZone.addEventListener('dragleave', function(e) { e.preventDefault(); this.classList.remove('drag-over'); });
        dropZone.addEventListener('drop', function(e) {
            e.preventDefault();
            this.classList.remove('drag-over');
            if (e.dataTransfer.files.length > 0) handleFileSelection(Array.from(e.dataTransfer.files));
        });

        function handleFileSelection(files) {
            if (appState !== 'room' || !conn) return;
            selectedFiles = files;
            renderFileList();
            if (selectedFiles.length > 0 && !transferComplete) {
                startSendingFiles();
            }
        }

        function renderFileList() {
            fileList.innerHTML = '';
            if (selectedFiles.length === 0) { fileList.classList.add('hidden'); return; }
            fileList.classList.remove('hidden');
            selectedFiles.forEach((f, i) => {
                const li = document.createElement('li');
                li.innerHTML = `<span class="file-icon">${getFileIcon(f.name)}</span><div class="file-info"><div class="file-name">${escapeHtml(f.name)}</div><div class="file-size">${formatSize(f.size)}</div></div><button class="file-remove" data-index="${i}" title="${t('remove_file')}">×</button>`;
                fileList.appendChild(li);
            });
            fileList.querySelectorAll('.file-remove').forEach(btn => {
                btn.addEventListener('click', function() {
                    const index = parseInt(this.getAttribute('data-index'));
                    selectedFiles.splice(index, 1);
                    renderFileList();
                    fileInput.value = '';
                });
            });
        }

        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const icons = { jpg: '🖼️', jpeg: '🖼️', png: '🖼️', gif: '🖼️', webp: '🖼️', svg: '🖼️', bmp: '🖼️', mp4: '🎬', mov: '🎬', avi: '🎬', mkv: '🎬', mp3: '🎵', wav: '🎵', flac: '🎵', aac: '🎵', pdf: '📕', doc: '📝', docx: '📝', xls: '📊', xlsx: '📊', ppt: '📽️', pptx: '📽️', zip: '📦', rar: '📦', '7z': '📦', tar: '📦', gz: '📦', txt: '📄', json: '📄', csv: '📄', html: '🌐', css: '🎨', js: '⚙️', py: '🐍', exe: '💻', apk: '📱', dmg: '💿' };
            return icons[ext] || '📎';
        }

        function checkUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const roomParam = params.get('room');
            if (roomParam && appState === 'idle') {
                roomCodeInput.value = roomParam.trim().toUpperCase();
                joinRoom();
            }
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && appState === 'joining' && roomCodeInput.value.trim().length >= 3) {
                joinRoom();
            }
        });

        window.addEventListener('beforeunload', cleanupPeer);

        // ============ 初始化 ============
        applyLanguage();
        showScreen(screenIdle);
        checkUrlParams();
    </script>
</body>
