<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P 文件互传</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path fill='%234f6ef7' d='M1.5 2A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h13a1.5 1.5 0 0 0 1.5-1.5v-7A1.5 1.5 0 0 0 14.5 4H8L6.5 2z'/></svg>">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root{--bg:#f0f2f5;--card:#fff;--primary:#4f6ef7;--text:#1a1a2e;--border:#e2e6f0;--shadow:0 8px 30px rgba(0,0,0,.08);--ai-msg-bg:#f0f0f0}
        html[data-theme="dark"]{--bg:#111827;--card:#1f2937;--primary:#818cf8;--text:#f1f5f9;--border:#334155;--shadow:0 8px 30px rgba(0,0,0,.4);--ai-msg-bg:#374151}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:var(--text);transition:background .3s}
        .card{background:var(--card);border-radius:16px;padding:24px;max-width:560px;width:100%;box-shadow:var(--shadow);border:1px solid var(--border)}
        .top{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
        .top h1{font-size:1.2rem;font-weight:700;flex:1}
        .top select{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:4px 6px;font-size:.8rem;cursor:pointer}
        .top button{background:none;border:none;font-size:1.2rem;cursor:pointer;padding:4px;border-radius:50%;color:var(--text)}
        .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:50px;font-size:.9rem;font-weight:600;cursor:pointer;border:none;transition:.2s;margin:4px}
        .btn-primary{background:var(--primary);color:#fff}.btn-secondary{background:transparent;color:var(--text);border:1.5px solid var(--border)}.btn-danger{background:#ef4444;color:#fff}.btn-sm{padding:5px 12px;font-size:.8rem;border-radius:30px}
        .room-code{font-size:1.8rem;font-weight:800;letter-spacing:3px;color:var(--primary);font-family:monospace;word-break:break-all}
        .drop-zone{border:2px dashed var(--border);border-radius:10px;padding:24px;text-align:center;cursor:pointer;margin:12px 0}.drop-zone:hover{border-color:var(--primary)}
        .file-list{list-style:none;margin:8px 0}.file-list li{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:4px;font-size:.85rem}
        .file-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .status{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:.8rem;font-weight:600}
        .status-connecting{background:#fffbeb;color:#b45309}.status-connected{background:#ecfdf5;color:#065f46}.status-transferring{background:#eff6ff;color:#1e40af}.status-complete{background:#ecfdf5;color:#065f46}.status-error{background:#fef2f2;color:#991b1b}
        .hidden{display:none!important}
        .version-switcher{position:fixed;bottom:16px;left:16px;display:flex;flex-direction:column;gap:4px;z-index:1000}
        .version-switcher button{padding:6px 12px;border-radius:20px;background:var(--card);border:1px solid var(--border);cursor:pointer;font-size:.75rem;font-weight:600;color:var(--text)}
        .version-switcher button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
        .about-modal,.settings-modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;z-index:1000;visibility:hidden;opacity:0;transition:.3s}
        .about-modal.open,.settings-modal.open{visibility:visible;opacity:1}
        .about-content,.settings-content{background:var(--card);border-radius:16px;padding:20px;max-width:480px;width:90%;max-height:80vh;overflow-y:auto;border:1px solid var(--border)}
        .about-content h2,.settings-content h2{color:var(--primary);margin-bottom:8px}
        .about-content h3{color:var(--primary);margin:12px 0 6px}
        .about-content p,.about-content li{font-size:.85rem;line-height:1.6}
        .disclaimer{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:.8rem;color:#666}
        .center{text-align:center;font-weight:600;margin-top:8px}
        #aiAssistant{position:fixed;bottom:16px;right:16px;z-index:999}
        .ai-btn{width:50px;height:50px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:24px;cursor:pointer}
        .ai-window{width:260px;background:var(--card);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.2);margin-bottom:8px;display:none;border:1px solid var(--border);position:relative}
        .ai-header{background:var(--primary);color:#fff;padding:8px 12px;font-weight:600;font-size:.85rem;display:flex;align-items:center;justify-content:space-between}
        .ai-header button{background:none;border:none;color:#fff;cursor:pointer;font-size:1rem}
        .ai-messages{height:150px;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px}
        .msg{padding:6px 10px;border-radius:10px;max-width:85%;font-size:.8rem;word-break:break-word}
        .msg.user{background:var(--primary);color:#fff;align-self:flex-end}
        .msg.assistant{background:var(--ai-msg-bg);color:var(--text);align-self:flex-start}
        .ai-input-area{display:flex;padding:6px;border-top:1px solid var(--border)}
        .ai-input{flex:1;padding:6px 10px;border:1px solid var(--border);border-radius:16px;background:var(--card);color:var(--text);font-size:.8rem}
        .ai-send{background:var(--primary);color:#fff;border:none;border-radius:50%;width:30px;height:30px;margin-left:6px;cursor:pointer}
        .settings-row{margin-bottom:10px}
        .settings-row label{display:block;font-size:.85rem;margin-bottom:4px}
        .settings-row input{width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:.9rem}
    </style>
</head>
<body>
    <div class="version-switcher">
        <button class="active" data-v="modern" data-i18n="v_modern">🌐</button>
        <button data-v="legacy" data-i18n="v_legacy">📦</button>
        <button data-v="ancient" data-i18n="v_ancient">🏛️</button>
        <button id="aboutBtn" data-i18n="v_about">ℹ️</button>
    </div>

    <div class="about-modal" id="aboutModal">
        <div class="about-content">
            <h2 data-i18n="about_title"></h2>
            <p data-i18n="about_intro"></p>
            <ul style="margin-left:16px"><li><strong data-i18n="about_modern_title"></strong>: <span data-i18n="about_modern_desc"></span></li><li><strong data-i18n="about_legacy_title"></strong>: <span data-i18n="about_legacy_desc"></span></li><li><strong data-i18n="about_ancient_title"></strong>: <span data-i18n="about_ancient_desc"></span></li></ul>
            <h3 data-i18n="about_adv_title"></h3>
            <ul style="margin-left:16px"><li data-i18n="about_adv1"></li><li data-i18n="about_adv2"></li><li data-i18n="about_adv3"></li><li data-i18n="about_adv4"></li><li data-i18n="about_adv5"></li><li data-i18n="about_adv6"></li></ul>
            <div class="disclaimer"><strong data-i18n="about_disc_title"></strong> <span data-i18n="about_disc_text"></span><div class="center" data-i18n="about_tw"></div></div>
        </div>
    </div>

    <div class="settings-modal" id="settingsModal">
        <div class="settings-content">
            <h2 data-i18n="ai_settings"></h2>
            <p data-i18n="ai_settings_desc" style="font-size:.8rem;margin-bottom:10px;"></p>
            <div class="settings-row">
                <label data-i18n="ai_api_url"></label>
                <input type="text" id="apiUrlInput" placeholder="https://api.deepseek.com/chat/completions">
            </div>
            <div class="settings-row">
                <label data-i18n="ai_api_key"></label>
                <input type="password" id="apiKeyInput" placeholder="sk-...">
            </div>
            <div class="settings-row">
                <label data-i18n="ai_model"></label>
                <input type="text" id="apiModelInput" placeholder="deepseek-chat">
            </div>
            <div style="display:flex;gap:8px;margin-top:15px;">
                <button class="btn btn-primary" id="saveSettingsBtn" data-i18n="ai_save"></button>
                <button class="btn btn-secondary" id="cancelSettingsBtn" data-i18n="ai_cancel"></button>
            </div>
        </div>
    </div>

    <div id="ancientMode" class="hidden">
        <div class="card">
            <h2 data-i18n="v_ancient"></h2>
            <p data-i18n="ancient_browser"></p>
            <p data-i18n="ancient_suggest"></p>
            <hr>
            <h3 data-i18n="bt_title"></h3>
            <p data-i18n="bt_desc"></p>
            <button class="btn btn-secondary" id="bluetoothCheckBtn" data-i18n="bt_check"></button>
            <p id="bluetoothStatus"></p>
        </div>
    </div>

    <div id="legacyMode" class="hidden">
        <div class="card">
            <div class="top">
                <h1 data-i18n="legacy_title"></h1>
                <select id="legacyLangSelect" class="lang-select"></select>
                <button class="theme-toggle">🌙</button>
                <button class="fullscreen-toggle">⛶</button>
            </div>
            <p data-i18n="legacy_subtitle"></p>
            <div id="legacyScreenIdle">
                <button class="btn btn-primary" id="legacyBtnCreate" data-i18n="legacy_create"></button>
                <button class="btn btn-secondary" id="legacyBtnJoin" data-i18n="legacy_join"></button>
            </div>
            <div id="legacyScreenJoin" class="hidden">
                <input type="text" id="legacyRoomCodeInput" maxlength="8" data-i18n-placeholder="legacy_placeholder">
                <button class="btn btn-primary" id="legacyBtnJoinConfirm" data-i18n="legacy_join_confirm"></button>
                <button class="btn btn-secondary" id="legacyBtnBack" data-i18n="legacy_back"></button>
            </div>
            <div id="legacyScreenRoom" class="hidden">
                <div class="room-code" id="legacyRoomCodeDisplay"></div>
                <button class="btn btn-secondary btn-sm" id="legacyBtnCopyRoom" data-i18n="legacy_copy_code"></button>
                <div class="drop-zone" id="legacyDropZone"><span>📎</span><p data-i18n="legacy_drop"></p><input type="file" id="legacyFileInput" multiple hidden></div>
                <div id="legacySendStatus" class="status status-connecting"></div>
                <div id="legacyReceiveStatus" class="status status-connecting"></div>
                <button class="btn btn-secondary btn-sm" id="legacyBtnRestart" data-i18n="legacy_restart"></button>
            </div>
        </div>
    </div>

    <div id="modernMode" class="hidden">
        <div class="card">
            <div class="top">
                <h1 data-i18n="app_title"></h1>
                <select id="langSelect" class="lang-select"></select>
                <button class="theme-toggle">🌙</button>
                <button class="fullscreen-toggle">⛶</button>
            </div>
            <p data-i18n="app_subtitle"></p>
            <div id="screenIdle">
                <button class="btn btn-primary" id="btnCreate" data-i18n="create_room"></button>
                <button class="btn btn-secondary" id="btnJoin" data-i18n="join_room"></button>
            </div>
            <div id="screenJoin" class="hidden">
                <input type="text" id="roomCodeInput" maxlength="8" data-i18n-placeholder="placeholder_room_code">
                <button class="btn btn-primary" id="btnJoinConfirm" data-i18n="join"></button>
                <button class="btn btn-secondary" id="btnBack" data-i18n="back"></button>
            </div>
            <div id="screenRoom" class="hidden">
                <div class="room-code" id="roomCodeDisplay"></div>
                <div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;">
                    <button class="btn btn-secondary btn-sm" id="btnCopyRoom" data-i18n="copy_room"></button>
                    <button class="btn btn-secondary btn-sm" id="btnShareLink" data-i18n="copy_link"></button>
                    <button class="btn btn-secondary btn-sm" id="btnRestart" data-i18n="restart" style="margin-left:auto;"></button>
                </div>
                <div class="drop-zone" id="dropZone"><span>📎</span><p data-i18n="drop_hint"></p><p data-i18n="drop_sub"></p><input type="file" id="fileInput" multiple hidden></div>
                <div id="sendStatus" class="status status-connecting"></div>
                <div id="sendProgress" class="hidden"><div style="height:8px;background:#e0e0e0;border-radius:8px;overflow:hidden"><div id="sendProgressBar" style="width:0%;height:100%;background:var(--primary);border-radius:8px;transition:width .3s"></div></div><div id="sendProgressLabel" style="font-size:.75rem"></div></div>
                <h3 data-i18n="shared_files_section"></h3>
                <ul class="file-list" id="sharedFileList"></ul>
            </div>
            <div id="globalAlert" class="hidden"></div>
        </div>
    </div>

    <div id="aiAssistant">
        <div class="ai-window" id="aiWindow">
            <div class="ai-header">
                <span data-i18n="ai_header">🤖 AI</span>
                <button id="aiSettingsBtn" title="设置">⚙️</button>
            </div>
            <div class="ai-messages" id="aiMessages"><div class="msg assistant" data-i18n="ai_greeting"></div></div>
            <div class="ai-input-area"><input type="text" class="ai-input" id="aiInput" data-i18n-placeholder="ai_placeholder"><button class="ai-send" id="aiSendBtn">➤</button></div>
        </div>
        <button class="ai-btn" id="aiToggleBtn">💬</button>
    </div>

    <script>
        // ==================== 语言数据 ====================
        const LANGS=[['zh-CN','简体中文'],['zh-TW','繁體中文'],['en','English'],['ja','日本語'],['ko','한국어'],['ru','Русский'],['de','Deutsch'],['fr','Français'],['es','Español'],['ar','العربية'],['pt','Português'],['it','Italiano'],['nl','Nederlands'],['pl','Polski'],['tr','Türkçe'],['vi','Tiếng Việt'],['th','ไทย'],['id','Bahasa Indonesia'],['hi','हिन्दी'],['mn','Монгол']];

        async function sendAiMessage(){const q=aiInput.value.trim();if(!q)return;aiMessages.innerHTML+=`<div class="msg user">${q}</div>`;aiInput.value='';aiMessages.scrollTop=aiMessages.scrollHeight;const n=q.replace(/\s+/g,'').toLowerCase();if(n.includes('上上下下左右左右baba')||n.includes('↑↑↓↓←→←→baba')){window.open('https://www.bilibili.com/video/BV1GJ411x7h7/?spm_id_from=333.337.search-card.all.click','_blank');setTimeout(()=>{aiMessages.innerHTML+=`<div class="msg assistant">${t('ai_easter_egg')}</div>`;aiMessages.scrollTop=aiMessages.scrollHeight;},300);return;}

        const broadcast=m=>{const j=JSON.stringify(m);Object.values(conns).forEach(c=>c.open&&c.send(j));};
        const setupConn=c=>{const pid=c.peer;conns[pid]=c;c.on('open',()=>{if(isHost){broadcast({type:'peer-joined',peerId:pid});c.send(JSON.stringify({type:'peers-list',peers:Object.keys(conns).filter(p=>p!==pid)}));}else if(pid===roomId)c.send(JSON.stringify({type:'hello',peerId:myId}));setStatus('connected','connected_can_send');});c.on('data',d=>{if(typeof d==='string'){const m=JSON.parse(d);if(m.type==='peer-joined'){}else if(m.type==='file-meta'){receiving[m.fileId]={chunks:[],total:m.totalChunks,name:m.name,size:m.size,sender:m.senderName,got:0};}else if(m.type==='delete-file'){sharedFiles=sharedFiles.filter(f=>f.id!==m.fileId);renderShared();}}else if(d instanceof ArrayBuffer){const v=new DataView(d);if(d.byteLength<21||v.getUint8(0)!==1)return;const fid=new TextDecoder().decode(new Uint8Array(d,1,16));const ci=v.getUint32(17,false),tc=v.getUint32(21,false),data=new Uint8Array(d,25);if(!receiving[fid])return;receiving[fid].chunks[ci]=data;receiving[fid].got++;if(receiving[fid].got>=tc){const rf=receiving[fid];const bytes=new Uint8Array(rf.size);let o=0;for(let i=0;i<tc;i++)if(rf.chunks[i]){bytes.set(rf.chunks[i],o);o+=rf.chunks[i].byteLength;}const blob=new Blob([bytes]);const url=URL.createObjectURL(blob);sharedFiles.push({id:fid,name:rf.name,size:rf.size,sender:rf.sender,url});delete receiving[fid];renderShared();}}});c.on('close',()=>delete conns[pid]);c.on('error',()=>alertMsg(t('data_error'),'error'));};
        const sendChunk=(fid,ci,tc,data)=>{const id=new TextEncoder().encode(fid);const buf=new ArrayBuffer(1+16+4+4+data.byteLength);const v=new DataView(buf);v.setUint8(0,1);new Uint8Array(buf,1,16).set(id);v.setUint32(17,ci,false);v.setUint32(21,tc,false);new Uint8Array(buf,25).set(data);Object.values(conns).forEach(c=>c.open&&c.send(buf));};
        const createRoom=()=>{reset();isHost=true;roomId=genRoom();myId=roomId;appState='room';show('screenRoom');$('#roomCodeDisplay').textContent=roomId;peer=new Peer(roomId,PEER_CFG);peer.on('open',()=>setStatus('connecting','waiting_for_peer'));peer.on('connection',c=>setupConn(c));peer.on('error',e=>{if(e.type==='unavailable-id'){roomId=genRoom();$('#roomCodeDisplay').textContent=roomId;peer.destroy();createRoom();}else alertMsg(t('network_error'),'error');});};
        const joinRoom=()=>{const code=$('#roomCodeInput').value.trim().toUpperCase();if(!code)return;reset();roomId=code;isHost=false;appState='room';show('screenRoom');$('#roomCodeDisplay').textContent=roomId;peer=new Peer(PEER_CFG);peer.on('open',id=>{myId=id;const c=peer.connect(roomId,{reliable:true,serialization:'binary'});setupConn(c);});peer.on('error',e=>alertMsg(t('room_not_found'),'error'));};
        const reset=()=>{if(peer){try{peer.destroy();}catch(e){}}conns={};sharedFiles=[];receiving={};selectedFiles=[];appState='idle';show('screenIdle');};
        const startSend=()=>{if(!selectedFiles.length)return;if(!Object.keys(conns).length){alertMsg(t('waiting_for_connection'),'warning');return;}const n=Object.keys(conns).length;totalToSend=selectedFiles.reduce((s,f)=>s+f.size,0)*n;totalSent=0;$('#sendProgress').classList.remove('hidden');selectedFiles.forEach((file,idx)=>{const fid=`${myId}_${file.name}_${Date.now()}`;const tc=Math.ceil(file.size/CHUNK);broadcast({type:'file-meta',fileId:fid,name:file.name,size:file.size,totalChunks:tc,senderId:myId,senderName:myId});let ci=0;const r=new FileReader();const next=()=>{if(ci>=tc)return;r.readAsArrayBuffer(file.slice(ci*CHUNK,Math.min((ci+1)*CHUNK,file.size)));};r.onload=e=>{const d=new Uint8Array(e.target.result);sendChunk(fid,ci,tc,d);totalSent+=d.byteLength;ci++;$('#sendProgressBar').style.width=`${Math.round(totalSent/totalToSend*100)}%`;ci%20===0?setTimeout(next,5):next();};r.onerror=()=>alertMsg(t('read_error'),'error');next();});};
        $('#btnCreate').onclick=createRoom;$('#btnJoin').onclick=()=>{reset();appState='joining';show('screenJoin');$('#roomCodeInput').value='';};$('#btnJoinConfirm').onclick=joinRoom;$('#btnBack').onclick=reset;$('#btnRestart').onclick=reset;$('#btnCopyRoom').onclick=()=>navigator.clipboard.writeText(roomId).then(()=>alertMsg(t('copy_success'),'success'));$('#btnShareLink').onclick=()=>{const link=`${location.origin}${location.pathname}?room=${roomId}`;navigator.clipboard.writeText(link).then(()=>alertMsg(t('copy_success'),'success'));};
        $('#fileInput').onchange=e=>{selectedFiles=Array.from(e.target.files);startSend();};
        $('#dropZone').ondragover=e=>e.preventDefault();$('#dropZone').ondrop=e=>{e.preventDefault();if(e.dataTransfer.files.length){selectedFiles=Array.from(e.dataTransfer.files);startSend();}};
        window.__updateModernStatus=()=>{if(sendStatusObj)setStatus(sendStatusObj.s,sendStatusObj.k,sendStatusObj.v);renderShared();};
        // 兼容模式逻辑
        let legacyPeer,legacyConn,legacyRoom,legacyCreator,legacyState='idle',legacyFiles=[],legacyReceiving={},legacyMeta;
        const legacyShow=s=>{['legacyScreenIdle','legacyScreenJoin','legacyScreenRoom'].forEach(id=>$('#'+id).classList.add('hidden'));$('#'+s).classList.remove('hidden');};
        const legacyReset=()=>{if(legacyConn)legacyConn.close();if(legacyPeer)legacyPeer.destroy();legacyState='idle';legacyShow('legacyScreenIdle');};
        const legacySetStatus=(el,text,type)=>{const c={connected:'status-connected',transferring:'status-transferring',complete:'status-complete',error:'status-error'}[type]||'status-connecting';el.className=`status ${c}`;el.textContent=text;};
        const legacyCode=()=>Array.from({length:6},()=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.random()*32|0]).join('');
        const legacySetup=()=>{legacyConn.on('open',()=>{legacyState='room';legacySetStatus($('#legacySendStatus'),t('legacy_connected'),'connected');});legacyConn.on('data',d=>{if(typeof d==='string'){const m=JSON.parse(d);if(m.type==='file-meta'){legacyMeta=m;legacyReceiving={};legacySetStatus($('#legacyReceiveStatus'),t('legacy_receive_file',{name:m.name}),'transferring');}}else if(d instanceof ArrayBuffer){const v=new DataView(d);if(d.byteLength<13)return;const ci=v.getUint32(1,false),tc=v.getUint32(5,false),data=new Uint8Array(d,9);if(!legacyReceiving[ci])legacyReceiving[ci]=data;if(Object.keys(legacyReceiving).length>=tc){const bytes=new Uint8Array(legacyMeta.size);let o=0;for(let i=0;i<tc;i++)if(legacyReceiving[i]){bytes.set(legacyReceiving[i],o);o+=legacyReceiving[i].byteLength;}const blob=new Blob([bytes]);const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=legacyMeta.name;a.click();legacySetStatus($('#legacyReceiveStatus'),t('legacy_receive_complete'),'complete');}}});legacyConn.on('close',()=>legacySetStatus($('#legacySendStatus'),t('legacy_conn_closed'),'error'));};
        const legacySend=()=>{if(!legacyConn||!legacyFiles.length)return;const file=legacyFiles[0];const tc=Math.ceil(file.size/65536);legacyConn.send(JSON.stringify({type:'file-meta',name:file.name,size:file.size,totalChunks:tc}));const r=new FileReader();let ci=0;const next=()=>{if(ci>=tc){legacySetStatus($('#legacySendStatus'),t('legacy_send_complete'),'complete');return;}r.readAsArrayBuffer(file.slice(ci*65536,Math.min((ci+1)*65536,file.size)));};r.onload=e=>{const d=new Uint8Array(e.target.result);const buf=new ArrayBuffer(9+d.byteLength);const v=new DataView(buf);v.setUint8(0,1);v.setUint32(1,ci,false);v.setUint32(5,tc,false);new Uint8Array(buf,9).set(d);legacyConn.send(buf);ci++;legacySetStatus($('#legacySendStatus'),t('legacy_sending_progress',{percent:Math.round(ci/tc*100)}),'transferring');setTimeout(next,10);};r.onerror=()=>legacySetStatus($('#legacySendStatus'),t('legacy_read_error'),'error');next();};
        $('#legacyBtnCreate').onclick=()=>{legacyReset();legacyCreator=true;legacyRoom=legacyCode();legacyState='room';legacyShow('legacyScreenRoom');$('#legacyRoomCodeDisplay').textContent=legacyRoom;legacyPeer=new Peer(legacyRoom,PEER_CFG);legacyPeer.on('open',()=>legacySetStatus($('#legacySendStatus'),t('legacy_wait_peer'),'connecting'));legacyPeer.on('connection',c=>{legacyConn=c;legacySetup();});legacyPeer.on('error',e=>{if(e.type==='unavailable-id'){legacyRoom=legacyCode();$('#legacyRoomCodeDisplay').textContent=legacyRoom;legacyPeer.destroy();$('#legacyBtnCreate').click();}});};
        $('#legacyBtnJoin').onclick=()=>{legacyReset();legacyState='joining';legacyShow('legacyScreenJoin');};
        $('#legacyBtnBack').onclick=legacyReset;
        $('#legacyBtnJoinConfirm').onclick=()=>{const code=$('#legacyRoomCodeInput').value.trim().toUpperCase();if(!code)return;legacyRoom=code;legacyCreator=false;legacyState='room';legacyShow('legacyScreenRoom');$('#legacyRoomCodeDisplay').textContent=legacyRoom;legacyPeer=new Peer(PEER_CFG);legacyPeer.on('open',()=>{legacyConn=legacyPeer.connect(legacyRoom,{reliable:true,serialization:'binary'});legacySetup();});legacyPeer.on('error',()=>legacyReset());};
        $('#legacyBtnCopyRoom').onclick=()=>navigator.clipboard.writeText(legacyRoom).then(()=>alertMsg(t('legacy_copy_success'),'success'));
        $('#legacyBtnRestart').onclick=legacyReset;
        $('#legacyDropZone').ondragover=e=>e.preventDefault();$('#legacyDropZone').ondrop=e=>{e.preventDefault();if(e.dataTransfer.files.length){legacyFiles=Array.from(e.dataTransfer.files);legacySend();}};
        $('#legacyFileInput').onchange=e=>{legacyFiles=Array.from(e.target.files);legacySend();};
        window.__updateLegacyStatus=()=>{if(legacyState==='idle'){legacySetStatus($('#legacySendStatus'),t('legacy_wait_conn'),'connecting');legacySetStatus($('#legacyReceiveStatus'),t('legacy_wait_recv'),'connecting');}else if(legacyState==='room'){if(legacyConn&&legacyConn.open){legacySetStatus($('#legacySendStatus'),t('legacy_connected'),'connected');legacySetStatus($('#legacyReceiveStatus'),t('legacy_wait_files'),'connected');}else{legacySetStatus($('#legacySendStatus'),t('legacy_wait_peer'),'connecting');legacySetStatus($('#legacyReceiveStatus'),t('legacy_wait_recv'),'connecting');}}};
        applyLang();
    </script>
</body>
</html>
