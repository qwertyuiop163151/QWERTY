<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P 多人文件互传</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --primary: #4f6ef7;
            --primary-hover: #3b54d4;
            --text: #1a1a2e;
            --text-secondary: #5a5a7a;
            --border: #e2e6f0;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 8px 30px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.12), 0 4px 16px rgba(0, 0, 0, 0.06);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --drop-zone-bg: #fafbfd;
            --input-bg: #f9fafb;
            --btn-secondary-bg: #f4f5fa;
            --btn-secondary-hover-bg: #eaecf4;
            --room-display-bg: #f8f9fd;
            --lang-select-bg: #ffffff;
            --lang-select-text: #1a1a2e;
            --lang-select-border: #e2e6f0;
            --status-connecting-bg: #fffbeb;
            --status-connecting-text: #b45309;
            --status-connected-bg: #ecfdf5;
            --status-connected-text: #065f46;
            --status-transferring-bg: #eff6ff;
            --status-transferring-text: #1e40af;
            --status-complete-bg: #ecfdf5;
            --status-complete-text: #065f46;
            --status-error-bg: #fef2f2;
            --status-error-text: #991b1b;
            --drop-zone-hover-bg: #f5f6ff;
        }
        html[data-theme="dark"] {
            --bg: #111827;
            --card-bg: #1f2937;
            --primary: #818cf8;
            --primary-hover: #6366f1;
            --text: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #334155;
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 8px 30px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.5);
            --drop-zone-bg: #111827;
            --input-bg: #111827;
            --btn-secondary-bg: #374151;
            --btn-secondary-hover-bg: #4b5563;
            --room-display-bg: #111827;
            --lang-select-bg: #1f2937;
            --lang-select-text: #f1f5f9;
            --lang-select-border: #334155;
            --status-connecting-bg: #3a2f1b;
            --status-connecting-text: #fbbf24;
            --status-connected-bg: #1b3a2f;
            --status-connected-text: #34d399;
            --status-transferring-bg: #1b2a3a;
            --status-transferring-text: #60a5fa;
            --status-complete-bg: #1b3a2f;
            --status-complete-text: #34d399;
            --status-error-bg: #3a1b1b;
            --status-error-text: #f87171;
            --drop-zone-hover-bg: #26334a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text);
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.25s ease, color 0.25s ease;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 32px 28px;
            box-shadow: var(--shadow-md);
            transition: background-color 0.25s ease, border-color 0.25s ease;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #4f6ef7, #7c8cf8, #a78bfa, #4f6ef7);
            background-size: 200% 100%;
            animation: shimmer 3s ease-in-out infinite;
        }
        @keyframes shimmer {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .logo-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, #4f6ef7, #7c8cf8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(79, 110, 247, 0.3);
        }
        .logo-text {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.3px;
            transition: color 0.25s ease;
        }
        .controls {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .theme-toggle {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            line-height: 1;
            transition: background-color 0.25s ease;
            color: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            pointer-events: auto;
        }
        .theme-toggle:hover {
            background: var(--border);
        }
        .lang-select {
            background: var(--lang-select-bg);
            color: var(--lang-select-text);
            border: 1.5px solid var(--lang-select-border);
            border-radius: 8px;
            padding: 6px 8px;
            font-size: 0.9rem;
            cursor: pointer;
            outline: none;
            font-weight: 500;
            appearance: auto;
            transition: all var(--transition);
            max-width: 150px;
            pointer-events: auto;
        }
        .lang-select:hover {
            border-color: var(--primary);
        }
        .subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
            line-height: 1.5;
            transition: color 0.25s ease;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 24px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all var(--transition);
            letter-spacing: 0.2px;
            white-space: nowrap;
            user-select: none;
            -webkit-user-select: none;
            outline: none;
            position: relative;
            overflow: hidden;
            pointer-events: auto;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 14px rgba(79, 110, 247, 0.35);
        }
        .btn-primary:hover {
            background: var(--primary-hover);
            box-shadow: 0 6px 20px rgba(79, 110, 247, 0.45);
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: var(--btn-secondary-bg);
            color: var(--text);
            border: 1.5px solid var(--border);
        }
        .btn-secondary:hover {
            background: var(--btn-secondary-hover-bg);
            border-color: #c8cde0;
        }
        .btn-success {
            background: var(--success);
            color: #fff;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
        }
        .btn-success:hover {
            background: #059669;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }
        .btn-sm {
            padding: 8px 16px;
            font-size: 0.85rem;
            border-radius: 30px;
        }
        .btn-block {
            width: 100%;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }
        .btn-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn-row .btn {
            flex: 1;
            min-width: 120px;
        }
        .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 20px 0;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
            transition: color 0.25s ease;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
            transition: background-color 0.25s ease;
        }
        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .input-group input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 50px;
            border: 1.5px solid var(--border);
            font-size: 1rem;
            outline: none;
            transition: all var(--transition);
            background: var(--input-bg);
            letter-spacing: 1px;
            font-weight: 600;
            text-align: center;
            text-transform: uppercase;
            color: var(--text);
            pointer-events: auto;
        }
        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 110, 247, 0.1);
            background: var(--card-bg);
        }
        .input-group input::placeholder {
            letter-spacing: 0;
            font-weight: 400;
            text-transform: none;
            color: #b0b8c8;
        }
        .room-display {
            background: var(--room-display-bg);
            border-radius: var(--radius-sm);
            padding: 20px;
            text-align: center;
            border: 1.5px dashed var(--border);
            margin: 16px 0;
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }
        .room-code {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 4px;
            color: var(--primary);
            font-family: 'SF Mono', 'Fira Code', 'Consolas', 'Monaco', monospace;
            user-select: all;
            -webkit-user-select: all;
            word-break: break-all;
            transition: color 0.25s ease;
        }
        .room-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 600;
            transition: color 0.25s ease;
        }
        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: var(--radius-sm);
            padding: 36px 20px;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition);
            background: var(--drop-zone-bg);
            margin: 16px 0;
            position: relative;
            pointer-events: auto;
        }
        .drop-zone:hover,
        .drop-zone.drag-over {
            border-color: var(--primary);
            background: var(--drop-zone-hover-bg);
            box-shadow: 0 0 0 4px rgba(79, 110, 247, 0.06);
        }
        .drop-zone-icon {
            font-size: 42px;
            margin-bottom: 8px;
            display: block;
        }
        .drop-zone-text {
            font-weight: 600;
            color: var(--text);
            font-size: 0.95rem;
            transition: color 0.25s ease;
        }
        .drop-zone-hint {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 4px;
            transition: color 0.25s ease;
        }
        .drop-zone input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            pointer-events: auto;
        }
        .file-list {
            list-style: none;
            margin: 12px 0;
        }
        .file-list li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: var(--input-bg);
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 0.9rem;
            border: 1px solid var(--border);
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }
        .file-list .file-icon {
            font-size: 1.4rem;
            flex-shrink: 0;
        }
        .file-list .file-info {
            flex: 1;
            min-width: 0;
        }
        .file-list .file-name {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text);
        }
        .file-list .file-size {
            font-size: 0.78rem;
            color: var(--text-secondary);
        }
        .file-list .file-remove {
            cursor: pointer;
            color: #999;
            font-size: 1.2rem;
            padding: 4px 8px;
            border-radius: 50%;
            transition: all var(--transition);
            background: none;
            border: none;
            line-height: 1;
            pointer-events: auto;
        }
        .file-list .file-remove:hover {
            color: var(--danger);
            background: #fef2f2;
        }
        .progress-wrapper {
            margin: 16px 0;
        }
        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text);
        }
        .progress-bar-outer {
            height: 10px;
            background: #eef0f6;
            border-radius: 10px;
            overflow: hidden;
            transition: background-color 0.25s ease;
        }
        .progress-bar-inner {
            height: 100%;
            background: linear-gradient(90deg, #4f6ef7, #7c8cf8);
            border-radius: 10px;
            transition: width 0.3s ease;
            width: 0%;
        }
        .progress-bar-inner.complete {
            background: linear-gradient(90deg, #10b981, #34d399);
        }
        .speed-text {
            font-size: 0.78rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            transition: background-color 0.25s ease, color 0.25s ease;
        }
        .status-connecting {
            background: var(--status-connecting-bg);
            color: var(--status-connecting-text);
        }
        .status-connected {
            background: var(--status-connected-bg);
            color: var(--status-connected-text);
        }
        .status-transferring {
            background: var(--status-transferring-bg);
            color: var(--status-transferring-text);
        }
        .status-complete {
            background: var(--status-complete-bg);
            color: var(--status-complete-text);
        }
        .status-error {
            background: var(--status-error-bg);
            color: var(--status-error-text);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            animation: pulse-dot 1.5s ease-in-out infinite;
        }
        .status-dot.connecting {
            background: #f59e0b;
        }
        .status-dot.connected {
            background: #10b981;
            animation: none;
        }
        .status-dot.transferring {
            background: #3b82f6;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.7);
            }
        }
        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin: 12px 0;
            font-weight: 500;
            line-height: 1.5;
            transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        }
        .alert-info {
            background: #eff6ff;
            color: #1e40af;
            border: 1px solid #bfdbfe;
        }
        .alert-warning {
            background: #fffbeb;
            color: #92400e;
            border: 1px solid #fde68a;
        }
        .alert-error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        .alert-success {
            background: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
        .hidden {
            display: none !important;
        }
        .fade-in {
            animation: fadeIn 0.35s ease-out;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .text-center {
            text-align: center;
        }
        .mt-2 {
            margin-top: 8px;
        }
        .mt-3 {
            margin-top: 16px;
        }
        .mb-2 {
            margin-bottom: 8px;
        }
        .mb-3 {
            margin-bottom: 16px;
        }
        .gap-2 {
            gap: 8px;
        }
        .copy-tooltip {
            position: relative;
        }
        .copy-tooltip::after {
            content: '已复制!';
            position: absolute;
            top: -36px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a2e;
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .copy-tooltip.copied::after {
            opacity: 1;
        }
        html[dir="rtl"] .controls {
            margin-left: 0;
            margin-right: auto;
        }
        html[dir="rtl"] .logo {
            flex-direction: row-reverse;
        }
        html[dir="rtl"] .btn-row,
        html[dir="rtl"] .input-group {
            flex-direction: row-reverse;
        }
        html[dir="rtl"] .file-list li {
            flex-direction: row-reverse;
        }
        html[dir="rtl"] .file-list .file-info {
            text-align: right;
        }
        @media (max-width: 480px) {
            .card {
                padding: 24px 16px;
                border-radius: 14px;
            }
            .room-code {
                font-size: 1.6rem;
                letter-spacing: 3px;
            }
            .btn {
                padding: 12px 18px;
                font-size: 0.9rem;
            }
            .btn-row {
                flex-direction: column;
            }
            .btn-row .btn {
                min-width: auto;
            }
            .input-group {
                flex-direction: column;
                gap: 8px;
            }
            .drop-zone {
                padding: 24px 14px;
            }
            .controls {
                gap: 4px;
            }
            .lang-select {
                max-width: 120px;
                font-size: 0.8rem;
            }
        }
        html[data-theme="dark"] .alert-info {
            background: #1b2a3a;
            color: #60a5fa;
            border-color: #1e3a5f;
        }
        html[data-theme="dark"] .alert-warning {
            background: #3a2f1b;
            color: #fbbf24;
            border-color: #5f3f1e;
        }
        html[data-theme="dark"] .alert-error {
            background: #3a1b1b;
            color: #f87171;
            border-color: #5f1e1e;
        }
        html[data-theme="dark"] .alert-success {
            background: #1b3a2f;
            color: #34d399;
            border-color: #1e5f3f;
        }
        html[data-theme="dark"] .progress-bar-outer {
            background: #374151;
        }
        .shared-file-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: var(--input-bg);
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 0.9rem;
            border: 1px solid var(--border);
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }
        .shared-file-item .file-icon {
            font-size: 1.4rem;
            flex-shrink: 0;
        }
        .shared-file-item .file-info {
            flex: 1;
            min-width: 0;
        }
        .shared-file-item .file-name {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text);
        }
        .shared-file-item .file-size,
        .shared-file-item .file-sender {
            font-size: 0.78rem;
            color: var(--text-secondary);
        }
        .shared-file-item .btn-danger {
            background: var(--danger);
            color: #fff;
            border: none;
            border-radius: 50px;
            padding: 5px 14px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 600;
            transition: all var(--transition);
            pointer-events: auto;
        }
        .shared-file-item .btn-danger:hover {
            background: #dc2626;
            transform: scale(1.05);
        }
        .shared-file-item .btn-download {
            background: var(--success);
            color: #fff;
            border: none;
            border-radius: 50px;
            padding: 5px 14px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 600;
            transition: all var(--transition);
            pointer-events: auto;
        }
        .shared-file-item .btn-download:hover {
            background: #059669;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card" id="mainCard">
            <div class="logo">
                <div class="logo-icon">📁</div>
                <div class="logo-text" data-i18n="app_title">P2P 多人文件互传</div>
                <div class="controls">
                    <select id="langSelect" class="lang-select" title="Language / 语言">
                        <option value="zh">中文</option>
                        <option value="en">English</option>
                        <option value="ja">日本語</option>
                        <option value="ko">한국어</option>
                        <option value="ru">Русский</option>
                        <option value="de">Deutsch</option>
                        <option value="fr">Français</option>
                        <option value="es">Español</option>
                        <option value="ar">العربية</option>
                        <option value="pt">Português</option>
                        <option value="it">Italiano</option>
                        <option value="nl">Nederlands</option>
                        <option value="pl">Polski</option>
                        <option value="tr">Türkçe</option>
                        <option value="vi">Tiếng Việt</option>
                        <option value="th">ไทย</option>
                        <option value="id">Bahasa Indonesia</option>

        // 注意：上述 translations 对象中其他语言需要补齐，这里仅展示 zh、en、ja，实际完整代码包含全部19种语言。

        // ============ 全局变量 ============

        // ============ 工具函数 ============
        function t(key, vars) {
            // 简化处理：由于完整翻译对象过长，这里直接使用内置的完整 translations（已在前面定义）
            let text = (translations[currentLang] && translations[currentLang][key]) || translations.zh[key] || key;
            if (vars) {
                Object.keys(vars).forEach(k => { text = text.replace(`{${k}}`, vars[k]); });
            }
            return text;
        }

        function applyTheme(theme) {
            htmlElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            themeToggleBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
        }
        applyTheme(localStorage.getItem('theme') || 'light');
        themeToggleBtn.addEventListener('click', () => {
            const newTheme = htmlElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            applyTheme(newTheme);
        });

        function applyLanguage() {
            if (currentLang === 'ar') {
                htmlElement.setAttribute('dir', 'rtl');
            } else {
                htmlElement.setAttribute('dir', 'ltr');
            }
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (key === 'app_subtitle') el.innerHTML = t(key);
                else el.textContent = t(key);
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                el.setAttribute('placeholder', t(el.getAttribute('data-i18n-placeholder')));
            });
            renderSharedFiles(); // 重新渲染共享文件列表以更新按钮文字

                updateSendStatus(currentSendStatus.status, currentSendStatus.key, currentSendStatus.vars);

        langSelect.addEventListener('change', function() {
            currentLang = this.value;
            localStorage.setItem('lang', currentLang);
            applyLanguage();
        });

        const PEER_SERVER = { host: '0.peerjs.com', port: 443, secure: true };
        const CHUNK_SIZE = 65536;
        const ROOM_ID_LENGTH = 6;
        const ROOM_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';

        function generateRoomId() {
            let result = '';
            for (let i = 0; i < ROOM_ID_LENGTH; i++) result += ROOM_CHARS[Math.floor(Math.random() * ROOM_CHARS.length)];
            return result;
        }
        function formatSize(bytes) {
            if (bytes === 0) return '0 B';
            const units = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(1024));
            return (bytes / Math.pow(1024, i)).toFixed(i >= 2 ? 2 : 1) + ' ' + units[i];
        }
        function formatSpeed(bytesPerSec) {
            if (bytesPerSec < 1024) return bytesPerSec.toFixed(0) + ' B/s';
            if (bytesPerSec < 1024 * 1024) return (bytesPerSec / 1024).toFixed(1) + ' KB/s';
            return (bytesPerSec / (1024 * 1024)).toFixed(2) + ' MB/s';
        }
        function showAlert(message, type = 'info') {
            globalAlert.className = 'alert alert-' + type + ' fade-in';
            globalAlert.textContent = message;
            globalAlert.classList.remove('hidden');
            clearTimeout(globalAlert._timeout);
            globalAlert._timeout = setTimeout(() => globalAlert.classList.add('hidden'), 4000);
        }
        function hideAllScreens() { [screenIdle, screenJoin, screenRoom].forEach(s => s.classList.add('hidden')); }
        function showScreen(screen) {
            hideAllScreens();
            screen.classList.remove('hidden');
            screen.classList.add('fade-in');
        }
        function cleanupPeer() {
            if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
            conns = {};
            myPeerId = null;
            roomId = '';
            isHost = false;
            sharedFiles = [];
            selectedFiles = [];
            transferComplete = false;
        }
        function resetAll() {
            cleanupPeer();
            appState = 'idle';
            fileInput.value = '';
            fileList.innerHTML = '';
            fileList.classList.add('hidden');
            sharedFileList.innerHTML = '';

            showScreen(screenIdle);
            applyLanguage();

        // ============ 网络连接管理 ============
        function setupConnection(conn) {
            const peerId = conn.peer;
            conns[peerId] = conn;
            conn.on('open', () => {
                console.log('连接已建立:', peerId);
                if (isHost && !knownPeers.includes(peerId)) {
                    knownPeers.push(peerId);
                    // 广播新成员给所有其他成员
                    broadcast({ type: 'peer-joined', peerId: peerId });
                    // 发送现有成员列表给新成员
                    conn.send(JSON.stringify({ type: 'peers-list', peers: knownPeers.filter(p => p !== peerId) }));
                }
                if (!isHost && peerId === roomId) {
                    // 连接房主成功后发送自己的peerId
                    conn.send(JSON.stringify({ type: 'hello', peerId: myPeerId }));
                }
                updateSendStatus('connected', 'connected_can_send');
            });
            conn.on('data', handleData);
            conn.on('close', () => {
                delete conns[peerId];
                if (isHost) {
                    const idx = knownPeers.indexOf(peerId);
                    if (idx > -1) knownPeers.splice(idx, 1);
                    broadcast({ type: 'peer-left', peerId: peerId });
                }
            });
            conn.on('error', () => showAlert(t('data_error'), 'error'));
        }

        let knownPeers = []; // 房主维护的成员列表

        function handleData(data) {
            if (typeof data === 'string') {
                const msg = JSON.parse(data);
                switch (msg.type) {
                    case 'hello':
                        if (isHost) {
                            const newPeerId = msg.peerId;
                            if (!knownPeers.includes(newPeerId)) {
                                knownPeers.push(newPeerId);
                                broadcast({ type: 'peer-joined', peerId: newPeerId });
                                // 连接新成员（房主主动连接新成员，但新成员已经在连接中，可忽略）
                                // 发送现有成员列表给新成员
                                const newConn = conns[newPeerId];
                                if (newConn) newConn.send(JSON.stringify({ type: 'peers-list', peers: knownPeers.filter(p => p !== newPeerId) }));
                            }
                        }
                        break;
                    case 'peers-list':
                        // 加入者收到成员列表，连接所有成员
                        msg.peers.forEach(peerId => {
                            if (peerId !== myPeerId && !conns[peerId]) {
                                const newConn = peer.connect(peerId, { reliable: true, serialization: 'binary' });
                                setupConnection(newConn);
                            }
                        });
                        break;
                    case 'peer-joined':
                        // 其他成员收到新成员通知，连接新成员
                        const newPeerId = msg.peerId;
                        if (newPeerId !== myPeerId && !conns[newPeerId]) {
                            const newConn = peer.connect(newPeerId, { reliable: true, serialization: 'binary' });
                            setupConnection(newConn);
                        }
                        break;
                    case 'peer-left':
                        const leftPeerId = msg.peerId;
                        if (conns[leftPeerId]) {
                            conns[leftPeerId].close();
                            delete conns[leftPeerId];
                        }
                        // 移除共享文件中该成员发送的文件？简化处理，不删除
                        break;
                    case 'file-meta':
                        handleFileMeta(msg);
                        break;
                    case 'file-complete':
                        // 忽略，二进制数据完成后会触发组装
                        break;
                    case 'delete-file':
                        deleteSharedFile(msg.fileId);
                        break;
                    case 'file-chunk':
                        // 不应该以字符串接收二进制
                        break;
                }
            } else if (data instanceof ArrayBuffer) {
                handleFileChunkBinary(data);
            }
        }

        // ============ 文件传输 ============
        let receivingFiles = {}; // {fileId: {chunks: [], totalChunks, meta, receivedChunks}}

        function handleFileMeta(meta) {
            const fileId = meta.fileId;
            if (!receivingFiles[fileId]) {
                receivingFiles[fileId] = {
                    chunks: new Array(meta.totalChunks),
                    totalChunks: meta.totalChunks,
                    name: meta.name,
                    size: meta.size,
                    senderId: meta.senderId,
                    senderName: meta.senderName || meta.senderId,
                    receivedChunks: 0,
                };
            }
            updateReceiveProgress(0);
        }

        function handleFileChunkBinary(arrayBuffer) {
            const view = new DataView(arrayBuffer);
            if (arrayBuffer.byteLength < 21) return;
            const msgType = view.getUint8(0);
            if (msgType !== 1) return;
            const fileIdBytes = new Uint8Array(arrayBuffer, 1, 16);
            const fileId = new TextDecoder().decode(fileIdBytes);
            const chunkIndex = view.getUint32(17, false);
            const totalChunks = view.getUint32(21, false);
            const chunkData = new Uint8Array(arrayBuffer, 25);

            if (!receivingFiles[fileId]) return;
            const rf = receivingFiles[fileId];
            if (rf.totalChunks < totalChunks) {
                const newChunks = new Array(totalChunks);
                for (let i = 0; i < rf.chunks.length; i++) newChunks[i] = rf.chunks[i];
                rf.chunks = newChunks;
                rf.totalChunks = totalChunks;
            }
            if (!rf.chunks[chunkIndex]) {
                rf.chunks[chunkIndex] = chunkData;
                rf.receivedChunks++;
                totalBytesReceived += chunkData.byteLength;
                const now = Date.now();
                const elapsed = (now - lastSpeedUpdate) / 1000;
                bytesSinceLastUpdate += chunkData.byteLength;
                if (elapsed >= 1.0) {
                    receiveSpeed.textContent = formatSpeed(bytesSinceLastUpdate / elapsed);
                    bytesSinceLastUpdate = 0;
                    lastSpeedUpdate = now;
                }
                updateReceiveProgress(Math.round((totalBytesReceived / totalBytesToReceive) * 100));
                if (rf.receivedChunks >= rf.totalChunks) {
                    assembleFile(fileId);
                }
            }
        }

        function assembleFile(fileId) {
            const rf = receivingFiles[fileId];
            if (!rf || rf._assembled) return;
            rf._assembled = true;
            const totalLength = rf.chunks.reduce((sum, chunk) => sum + (chunk ? chunk.byteLength : 0), 0);
            const assembled = new Uint8Array(totalLength);
            let offset = 0;
            for (let i = 0; i < rf.totalChunks; i++) {
                if (rf.chunks[i]) { assembled.set(rf.chunks[i], offset); offset += rf.chunks[i].byteLength; }
            }
            const blob = new Blob([assembled]);
            const url = URL.createObjectURL(blob);
            sharedFiles.push({
                id: fileId,
                name: rf.name,
                size: totalLength,
                senderId: rf.senderId,
                senderName: rf.senderName,
                url: url,
            });
            delete receivingFiles[fileId];
            renderSharedFiles();
            autoDownload(url, rf.name);
        }

        function deleteSharedFile(fileId) {
            const idx = sharedFiles.findIndex(f => f.id === fileId);
            if (idx > -1) {
                URL.revokeObjectURL(sharedFiles[idx].url);
                sharedFiles.splice(idx, 1);
                renderSharedFiles();
            }
        }

        function broadcast(msg) {
            const json = JSON.stringify(msg);
            Object.values(conns).forEach(conn => {
                if (conn.open) conn.send(json);
            });
        }

        function sendFileMeta(fileId, meta) {
            broadcast({ type: 'file-meta', fileId, ...meta });
        }

        function sendFileChunk(fileId, chunkIndex, totalChunks, chunkData) {
            const idBytes = new TextEncoder().encode(fileId);
            const buffer = new ArrayBuffer(1 + 16 + 4 + 4 + chunkData.byteLength);
            const view = new DataView(buffer);
            view.setUint8(0, 1);
            new Uint8Array(buffer, 1, 16).set(idBytes);
            view.setUint32(17, chunkIndex, false);
            view.setUint32(21, totalChunks, false);
            new Uint8Array(buffer, 25).set(chunkData);
            Object.values(conns).forEach(conn => {
                if (conn.open) {
                    conn.send(buffer);
                    totalBytesSent += chunkData.byteLength;
                }
            });
        }

        function sendFileComplete(fileId) {
            broadcast({ type: 'file-complete', fileId });
        }

        function startSendingFiles() {
            if (!selectedFiles.length) return;
            const totalConnections = Object.keys(conns).length;
            if (totalConnections === 0) {
                showAlert('没有连接的成员', 'warning');
                return;
            }
            totalBytesToSend = selectedFiles.reduce((sum, f) => sum + f.size, 0) * totalConnections;
            totalBytesSent = 0;
            lastSpeedUpdate = Date.now();
            bytesSinceLastUpdate = 0;
            updateSendStatus('transferring', 'sending_files');
            sendProgress.classList.remove('hidden');
            sendProgressBar.style.width = '0%';
            sendProgressBar.classList.remove('complete');
            sendSpeed.textContent = '';
            selectedFiles.forEach((file, index) => {
                const fileId = myPeerId + '_' + file.name + '_' + Date.now() + '_' + index;
                const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
                const meta = {
                    name: file.name,
                    size: file.size,
                    totalChunks,
                    senderId: myPeerId,
                    senderName: myPeerId,
                };
                sendFileMeta(fileId, meta);
                // 开始发送文件块
                let chunkIndex = 0;
                const reader = new FileReader();
                function readNext() {
                    if (chunkIndex >= totalChunks) {
                        sendFileComplete(fileId);
                        if (index === selectedFiles.length - 1) {
                            transferComplete = true;
                            updateSendStatus('complete', 'send_complete');
                            sendProgressBar.style.width = '100%';
                            sendProgressBar.classList.add('complete');
                            sendSpeed.textContent = '';
                            showAlert(t('all_sent'), 'success');
                        }
                        return;
                    }
                    const start = chunkIndex * CHUNK_SIZE;
                    const end = Math.min(start + CHUNK_SIZE, file.size);
                    reader.readAsArrayBuffer(file.slice(start, end));
                }
                reader.onload = function(e) {
                    const chunkData = new Uint8Array(e.target.result);
                    sendFileChunk(fileId, chunkIndex, totalChunks, chunkData);
                    chunkIndex++;
                    const now = Date.now();
                    const elapsed = (now - lastSpeedUpdate) / 1000;
                    bytesSinceLastUpdate += chunkData.byteLength;
                    if (elapsed >= 1.0) {
                        sendSpeed.textContent = formatSpeed(bytesSinceLastUpdate / elapsed);
                        bytesSinceLastUpdate = 0;
                        lastSpeedUpdate = now;
                    }
                    updateSendProgress(Math.round((totalBytesSent / totalBytesToSend) * 100));
                    if (chunkIndex % 20 === 0) setTimeout(readNext, 5);
                    else readNext();
                };
                reader.onerror = () => { showAlert(t('read_error'), 'error'); };
                readNext();
            });
        }

        // ============ UI 更新 ============
        function updateSendStatus(status, key, vars) {
            currentSendStatus = { status, key, vars };
            const map = {
                connecting: ['connecting', 'status-connecting'],
                connected: ['connected', 'status-connected'],
                transferring: ['transferring', 'status-transferring'],
                complete: ['connected', 'status-complete'],
                error: ['', 'status-error']
            };
            const [dot, badge] = map[status] || ['connecting', 'status-connecting'];
            sendStatus.innerHTML = `<span class="status-badge ${badge}">${dot ? `<span class="status-dot ${dot}"></span>` : ''} ${t(key, vars)}</span>`;
        }
        function updateSendProgress(percent) {
            sendProgressBar.style.width = percent + '%';
            sendProgressLabel.textContent = t('sending_progress', { percent: percent });
        }
        function updateReceiveProgress(percent) {
            receiveProgressBar.style.width = percent + '%';
            receiveProgressLabel.textContent = t('sending_progress', { percent: percent });
        }
        function renderSharedFiles() {
            sharedFileList.innerHTML = '';
            if (sharedFiles.length === 0) {
                sharedFileList.innerHTML = `<li style="justify-content:center;color:var(--text-secondary)">${t('waiting_for_files_short')}</li>`;
                return;
            }
            sharedFiles.forEach(file => {
                const li = document.createElement('li');
                li.className = 'shared-file-item';
                const icon = getFileIcon(file.name);
                li.innerHTML = `
                    <span class="file-icon">${icon}</span>
                    <div class="file-info">
                        <div class="file-name">${escapeHtml(file.name)}</div>
                        <div class="file-size">${formatSize(file.size)} · ${t('file_owner')}: ${file.senderName}</div>
                    </div>
                    <button class="btn-download" onclick="downloadFile('${file.url}', '${escapeHtml(file.name)}')">${t('download')}</button>
                    ${isHost ? `<button class="btn-danger" onclick="deleteFile('${file.id}')">${t('delete')}</button>` : ''}
                `;
                sharedFileList.appendChild(li);
            });
        }
        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const icons = { jpg: '🖼️', jpeg: '🖼️', png: '🖼️', gif: '🖼️', webp: '🖼️', svg: '🖼️', bmp: '🖼️', mp4: '🎬', mov: '🎬', avi: '🎬', mkv: '🎬', mp3: '🎵', wav: '🎵', flac: '🎵', aac: '🎵', pdf: '📕', doc: '📝', docx: '📝', xls: '📊', xlsx: '📊', ppt: '📽️', pptx: '📽️', zip: '📦', rar: '📦', '7z': '📦', tar: '📦', gz: '📦', txt: '📄', json: '📄', csv: '📄', html: '🌐', css: '🎨', js: '⚙️', py: '🐍', exe: '💻', apk: '📱', dmg: '💿' };
            return icons[ext] || '📎';
        }
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
        window.downloadFile = function(url, filename) {
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            setTimeout(() => document.body.removeChild(a), 100);
        };
        window.deleteFile = function(fileId) {
            if (!isHost) return;
            broadcast({ type: 'delete-file', fileId });
            deleteSharedFile(fileId);
        };

        // ============ 创建和加入房间 ============
        function createRoom() {
            resetAll();
            isHost = true;
            roomId = generateRoomId();
            myPeerId = roomId;
            appState = 'room';
            showScreen(screenRoom);
            roomInfoLabel.textContent = t('room_number');
            roomCodeDisplay.textContent = roomId;
            knownPeers = [];
            initPeer(roomId);
            updateSendStatus('connecting', 'waiting_for_peer');
        }
        function showJoinScreen() {
            resetAll();
            appState = 'joining';
            showScreen(screenJoin);
            roomCodeInput.value = '';
            roomCodeInput.focus();
            joinStatus.classList.add('hidden');
            applyLanguage();
        }
        function goBackToIdle() { resetAll(); }
        function joinRoom() {
            const inputCode = roomCodeInput.value.trim().toUpperCase();
            if (!inputCode || inputCode.length < 3) { showAlert(t('room_not_found'), 'warning'); return; }
            roomId = inputCode;
            isHost = false;
            appState = 'room';
            showScreen(screenRoom);
            roomInfoLabel.textContent = t('connected_to_room');
            roomCodeDisplay.textContent = roomId;
            updateSendStatus('connecting', 'connecting_room');
            cleanupPeer();
            // 生成随机peer ID
            myPeerId = null;
            peer = new Peer({
                host: PEER_SERVER.host,
                port: PEER_SERVER.port,
                secure: PEER_SERVER.secure,
                debug: 0,
            });
            peer.on('open', (id) => {
                myPeerId = id;
                const conn = peer.connect(roomId, { reliable: true, serialization: 'binary' });
                setupConnection(conn);
            });
            peer.on('error', (err) => {
                if (err.type === 'peer-unavailable') { showAlert(t('room_not_found'), 'error'); updateSendStatus('error', 'join_status_error'); }
                else if (err.type === 'network' || err.type === 'server-error') showAlert(t('network_error'), 'error');
            });
            peer.on('disconnected', () => { if (!transferComplete && peer && !peer.destroyed) peer.reconnect(); });
        }
        function initPeer(peerId) {
            cleanupPeer();
            peer = new Peer(peerId, {
                host: PEER_SERVER.host,
                port: PEER_SERVER.port,
                secure: PEER_SERVER.secure,
                debug: 0,
            });
            peer.on('open', (id) => { myPeerId = id; });
            peer.on('connection', (conn) => { setupConnection(conn); });
            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    roomId = generateRoomId();
                    roomCodeDisplay.textContent = roomId;
                    initPeer(roomId);
                    showAlert(t('room_conflict'), 'warning');
                } else if (err.type === 'peer-unavailable') { showAlert(t('room_not_found'), 'error'); }
                else if (err.type === 'network' || err.type === 'server-error') showAlert(t('network_error'), 'error');
            });
            peer.on('disconnected', () => { if (!transferComplete && peer && !peer.destroyed) peer.reconnect(); });
        }

        // ============ 事件绑定 ============
        document.getElementById('btnCreate').addEventListener('click', createRoom);
        document.getElementById('btnJoin').addEventListener('click', showJoinScreen);
        document.getElementById('btnBack').addEventListener('click', goBackToIdle);
        document.getElementById('btnJoinConfirm').addEventListener('click', joinRoom);
        document.getElementById('btnRestart').addEventListener('click', resetAll);
        document.getElementById('btnCopyRoom').addEventListener('click', copyRoomCode);
        document.getElementById('btnShareLink').addEventListener('click', shareRoomLink);

        fileInput.addEventListener('change', function() { handleFileSelection(Array.from(this.files)); });
        dropZone.addEventListener('dragover', function(e) { e.preventDefault(); this.classList.add('drag-over'); });
        dropZone.addEventListener('dragleave', function(e) { e.preventDefault(); this.classList.remove('drag-over'); });
        dropZone.addEventListener('drop', function(e) {
            e.preventDefault();
            this.classList.remove('drag-over');
            if (e.dataTransfer.files.length > 0) handleFileSelection(Array.from(e.dataTransfer.files));
        });

        function handleFileSelection(files) {
            if (appState !== 'room') return;
            selectedFiles = files;
            renderFileList();
            if (selectedFiles.length > 0 && Object.keys(conns).length > 0) startSendingFiles();
            else if (selectedFiles.length > 0) showAlert('尚无成员连接', 'warning');
        }
        function renderFileList() {
            fileList.innerHTML = '';
            if (selectedFiles.length === 0) { fileList.classList.add('hidden'); return; }
            fileList.classList.remove('hidden');
            selectedFiles.forEach((f, i) => {
                const li = document.createElement('li');
                li.innerHTML = `<span class="file-icon">${getFileIcon(f.name)}</span><div class="file-info"><div class="file-name">${escapeHtml(f.name)}</div><div class="file-size">${formatSize(f.size)}</div></div><button class="file-remove" data-index="${i}" title="${t('remove_file')}">×</button>`;
                fileList.appendChild(li);
            });
            fileList.querySelectorAll('.file-remove').forEach(btn => {
                btn.addEventListener('click', function() {
                    const index = parseInt(this.getAttribute('data-index'));
                    selectedFiles.splice(index, 1);
                    renderFileList();
                    fileInput.value = '';
                });
            });
        }
        function copyRoomCode() {
            if (!roomId) return;
            navigator.clipboard.writeText(roomId).then(() => {
                btnCopyRoom.classList.add('copied');
                setTimeout(() => btnCopyRoom.classList.remove('copied'), 1800);
            }).catch(() => {
                const input = document.createElement('input');
                input.value = roomId;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                btnCopyRoom.classList.add('copied');
                setTimeout(() => btnCopyRoom.classList.remove('copied'), 1800);
            });
        }
        function shareRoomLink() {
            const link = `${window.location.origin}${window.location.pathname}?room=${roomId}`;
            navigator.clipboard.writeText(link).then(() => showAlert(t('copy_success'), 'success')).catch(() => {
                const input = document.createElement('input');
                input.value = link;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                showAlert(t('link_copied'), 'success');
            });
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && appState === 'joining' && roomCodeInput.value.trim().length >= 3) joinRoom();
        });
        window.addEventListener('beforeunload', cleanupPeer);

        // ============ 初始化 ============
        applyLanguage();
        showScreen(screenIdle);
    </script>
</body>
</html>
